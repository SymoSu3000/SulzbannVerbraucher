<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

:root {
    color-scheme: light dark;

    --text: #20262b;
    --muted: #7d878d;

    --line: rgba(0,0,0,.14);
    --row-bg: rgba(0,0,0,.015);

    --blue: #2196f3;
    --orange: #f4a321;
    --green: #19c989;
    --grey: #9ca7af;
}

@media (prefers-color-scheme: dark) {
    :root {
        --text: #f1f4f6;
        --muted: #a7afb5;

        --line: rgba(255,255,255,.15);
        --row-bg: rgba(255,255,255,.018);

        --blue: #38a9ff;
        --orange: #ffad2f;
        --green: #1bd491;
        --grey: #9ca7af;
    }
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* ============================================================
   GESAMTKACHEL
============================================================ */

.consumers {
    width: 100%;
    height: 100%;

    display: grid;
    grid-template-rows: repeat(5, minmax(0, 1fr));

    gap: 4px;

    padding:
        44px
        8px
        8px;

    overflow: hidden;
}


/* ============================================================
   VERBRAUCHERZEILE
============================================================ */

.consumer-row {
    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        max-content
        max-content;

    align-items: center;

    gap: clamp(.45rem, 1.5vw, .9rem);

    padding:
        .25rem
        .45rem;

    border: 1px solid var(--line);
    border-radius: .8rem;

    background: var(--row-bg);

    overflow: hidden;
}


/* ============================================================
   ZONE 1
   ICON + NAME
============================================================ */

.main-zone {
    min-width: 0;

    display: grid;

    grid-template-columns:
        auto
        minmax(0, 1fr);

    align-items: center;

    gap: .55rem;
}


.icon-box {
    width: 2.55rem;
    aspect-ratio: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--line);
    border-radius: .65rem;
}


.icon {
    font-size: 1.65rem;
    line-height: 1;
}


.blue {
    color: var(--blue);
}


.orange {
    color: var(--orange);
}


.name-area {
    min-width: 0;
}


.name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    color: var(--text);

    font-size: 14px;
    font-weight: 700;

    line-height: 1.08;
}


.subtitle {
    margin-top: 2px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    color: var(--muted);

    font-size: 13px;
    line-height: 1.05;
}


/* ============================================================
   ZONE 2
   MODUS + STATUS
============================================================ */

.state-zone {
    min-width: max-content;

    display: flex;
    flex-direction: column;

    align-items: flex-start;
    justify-content: center;
}


.mode {
    color: var(--blue);

    font-size: 13px;
    font-weight: 650;

    line-height: 1.05;

    white-space: nowrap;
}


.mode.off {
    color: var(--muted);
}


.real-state {
    margin-top: 3px;

    display: flex;
    align-items: center;

    gap: 5px;

    color: var(--text);

    font-size: 13px;
    line-height: 1.05;

    white-space: nowrap;
}


.state-dot {
    width: 10px;
    height: 10px;

    flex: 0 0 auto;

    border-radius: 50%;

    background: var(--grey);
}


.state-dot.on {
    background: var(--green);
}


/* ============================================================
   ZONE 3
   LEISTUNG + ZAHNRAD
============================================================ */

.right-zone {
    min-width: max-content;

    display: flex;

    align-items: center;
    justify-content: flex-end;

    gap: .65rem;
}


.power {
    min-width: 4.3rem;

    color: var(--text);

    font-size: 14px;
    font-weight: 700;

    line-height: 1;

    text-align: right;

    white-space: nowrap;
}


.gear {
    width: 2.3rem;
    aspect-ratio: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    border: 1px solid var(--line);
    border-radius: .65rem;

    background: transparent;
    color: var(--text);

    font-size: 1.2rem;
}


/* ============================================================
   MOBILE
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
{

    .consumers {
        padding:
            43px
            7px
            7px;

        gap: 4px;
    }


    .consumer-row {
        gap: .45rem;

        padding:
            .22rem
            .4rem;
    }


    .main-zone {
        gap: .5rem;
    }


    .icon-box {
        width: 2.45rem;
    }


    .icon {
        font-size: 1.55rem;
    }


    .name {
        font-size: 14px;
    }


    .subtitle {
        font-size: 12px;
    }


    .mode,
    .real-state {
        font-size: 12px;
    }


    .power {
        min-width: 3.8rem;

        font-size: 14px;
    }


    .gear {
        width: 2.2rem;

        font-size: 1.15rem;
    }

}


/* ============================================================
   SEHR SCHMALES MOBILE
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
    and
    (max-width: 430px)
{

    .consumer-row {
        gap: .3rem;

        padding-left: .3rem;
        padding-right: .3rem;
    }


    .main-zone {
        gap: .35rem;
    }


    .icon-box {
        width: 2.2rem;
    }


    .icon {
        font-size: 1.4rem;
    }


    .name {
        font-size: 13px;
    }


    .subtitle,
    .mode,
    .real-state {
        font-size: 12px;
    }


    .right-zone {
        gap: .35rem;
    }


    .power {
        min-width: 3.4rem;

        font-size: 13px;
    }


    .gear {
        width: 2rem;

        font-size: 1rem;
    }

}


/* ============================================================
   DESKTOP / LAPTOP
============================================================ */

@media
    (hover: hover)
    and
    (pointer: fine)
{

    .name,
    .subtitle,
    .mode,
    .real-state,
    .power {
        font-size: 13px;
    }

}

</style>

</head>

<body>


<div class="consumers">


    <!-- UG -->

    <div class="consumer-row">

        <div class="main-zone">

            <div class="icon-box">
                <div class="icon blue">♧</div>
            </div>

            <div class="name-area">
                <div class="name">Entfeuchter UG</div>
                <div class="subtitle">Untergeschoss</div>
            </div>

        </div>


        <div class="state-zone">

            <div
                class="mode"
                id="ug-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="ug-dot"
                ></span>

                <span id="ug-state">
                    —
                </span>

            </div>

        </div>


        <div class="right-zone">

            <div
                class="power"
                id="ug-power"
            >
                —
            </div>

            <button
                type="button"
                class="gear"
            >
                ⚙
            </button>

        </div>

    </div>



    <!-- OG -->

    <div class="consumer-row">

        <div class="main-zone">

            <div class="icon-box">
                <div class="icon blue">♧</div>
            </div>

            <div class="name-area">
                <div class="name">Entfeuchter OG</div>
                <div class="subtitle">Obergeschoss</div>
            </div>

        </div>


        <div class="state-zone">

            <div
                class="mode"
                id="og-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="og-dot"
                ></span>

                <span id="og-state">
                    —
                </span>

            </div>

        </div>


        <div class="right-zone">

            <div
                class="power"
                id="og-power"
            >
                —
            </div>

            <button
                type="button"
                class="gear"
            >
                ⚙
            </button>

        </div>

    </div>



    <!-- POOL -->

    <div class="consumer-row">

        <div class="main-zone">

            <div class="icon-box">
                <div class="icon blue">≋</div>
            </div>

            <div class="name-area">
                <div class="name">Poolpumpe + Salzelektrolyse</div>
                <div class="subtitle">Pooltechnik</div>
            </div>

        </div>


        <div class="state-zone">

            <div
                class="mode"
                id="pool-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="pool-dot"
                ></span>

                <span id="pool-state">
                    —
                </span>

            </div>

        </div>


        <div class="right-zone">

            <div
                class="power"
                id="pool-power"
            >
                —
            </div>

            <button
                type="button"
                class="gear"
            >
                ⚙
            </button>

        </div>

    </div>



    <!-- BOILER -->

    <div class="consumer-row">

        <div class="main-zone">

            <div class="icon-box">
                <div class="icon orange">◉</div>
            </div>

            <div class="name-area">
                <div class="name">Boiler</div>
                <div class="subtitle">Warmwasser</div>
            </div>

        </div>


        <div class="state-zone">

            <div
                class="mode"
                id="boiler-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="boiler-dot"
                ></span>

                <span id="boiler-state">
                    —
                </span>

            </div>

        </div>


        <div class="right-zone">

            <div
                class="power"
                id="boiler-power"
            >
                —
            </div>

            <button
                type="button"
                class="gear"
            >
                ⚙
            </button>

        </div>

    </div>



    <!-- HEIZSTAB -->

    <div class="consumer-row">

        <div class="main-zone">

            <div class="icon-box">
                <div class="icon orange">▥</div>
            </div>

            <div class="name-area">
                <div class="name">Heizstab / Puffer</div>
                <div class="subtitle">Heizung</div>
            </div>

        </div>


        <div class="state-zone">

            <div
                class="mode"
                id="heater-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="heater-dot"
                ></span>

                <span id="heater-state">
                    —
                </span>

            </div>

        </div>


        <div class="right-zone">

            <div
                class="power"
                id="heater-power"
            >
                —
            </div>

            <button
                type="button"
                class="gear"
            >
                ⚙
            </button>

        </div>

    </div>


</div>


<script>

function setText(id,value){

    const element =
        document.getElementById(id);

    if(element){
        element.textContent = value;
    }
}


function modeText(value){

    const mode = Number(value);

    if(mode === 1){
        return "Automatik";
    }

    if(mode === 2){
        return "Erzwungen Ein";
    }

    return "Aus";
}


function powerText(value){

    if(
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ){
        return "—";
    }

    const number = Number(value);

    if(Math.abs(number) < 1){

        return (
            Math.round(number * 1000) +
            " W"
        );
    }

    return (
        number.toFixed(1) +
        " kW"
    );
}


function updateConsumer(key,data){

    if(!data){
        return;
    }

    const mode =
        Number(data.mode);

    const active =
        Boolean(data.active);


    setText(
        key + "-mode",
        modeText(mode)
    );


    setText(
        key + "-state",
        active
            ? "Gerät Ein"
            : "Gerät Aus"
    );


    setText(
        key + "-power",
        powerText(data.power)
    );


    const modeElement =
        document.getElementById(
            key + "-mode"
        );

    if(modeElement){

        modeElement.classList.toggle(
            "off",
            mode === 0
        );
    }


    const dot =
        document.getElementById(
            key + "-dot"
        );

    if(dot){

        dot.classList.toggle(
            "on",
            active
        );
    }
}


function handleMessage(data){

    if(!data){
        return;
    }

    if(typeof data === "string"){

        try{
            data = JSON.parse(data);
        }
        catch(error){
            return;
        }
    }


    updateConsumer(
        "ug",
        data.ug
    );

    updateConsumer(
        "og",
        data.og
    );

    updateConsumer(
        "pool",
        data.pool
    );

    updateConsumer(
        "boiler",
        data.boiler
    );

    updateConsumer(
        "heater",
        data.heater
    );
}


window.addEventListener(
    "load",
    function(){

        if(
            typeof requestAction ===
            "function"
        ){

            requestAction(
                "Refresh",
                true
            );
        }
    }
);

</script>

</body>
</html>
