<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<style>

* {
    box-sizing: border-box;
}


/* ============================================================
   THEME
============================================================ */

:root {
    color-scheme: light dark;

    --text: #20262b;
    --muted: #7d878d;

    --line: rgba(0, 0, 0, 0.14);
    --row-bg: rgba(0, 0, 0, 0.015);

    --blue: #2196f3;
    --orange: #f4a321;
    --green: #19c989;
    --grey: #9ca7af;
}


@media (prefers-color-scheme: dark) {

    :root {
        --text: #f1f4f6;
        --muted: #a7afb5;

        --line: rgba(255, 255, 255, 0.15);
        --row-bg: rgba(255, 255, 255, 0.018);

        --blue: #38a9ff;
        --orange: #ffad2f;
        --green: #1bd491;
        --grey: #9ca7af;
    }

}


/* ============================================================
   BASIS
============================================================ */

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* ============================================================
   GESAMTKACHEL
============================================================ */

.consumers {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows:
        repeat(5, minmax(0, 1fr));

    gap: 5px;

    /*
     * Symcon-Titel sicher freihalten.
     */
    padding:
        48px
        9px
        9px
        9px;

    overflow: hidden;
}


/* ============================================================
   VERBRAUCHERKARTE
============================================================ */

.consumer-row {
    min-width: 0;
    min-height: 0;

    display: grid;

    /*
     * Zeile 1:
     * Icon | Name | Leistung | Zahnrad
     *
     * Zeile 2:
     * Icon | Untertitel + Status | | Zahnrad
     */

    grid-template-columns:
        48px
        minmax(0, 1fr)
        76px
        44px;

    grid-template-rows:
        1fr
        1fr;

    grid-template-areas:
        "icon name power gear"
        "icon meta meta gear";

    column-gap: 8px;
    row-gap: 1px;

    align-items: center;

    padding:
        5px
        7px;

    border:
        1px solid
        var(--line);

    border-radius: 13px;

    background:
        var(--row-bg);

    overflow: hidden;
}


/* ============================================================
   ICON
============================================================ */

.icon-box {
    grid-area: icon;

    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    border:
        1px solid
        var(--line);

    border-radius: 11px;
}


.icon {
    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 28px;

    line-height: 1;
}


.blue {
    color: var(--blue);
}


.orange {
    color: var(--orange);
}


/* ============================================================
   NAME
============================================================ */

.name {
    grid-area: name;

    min-width: 0;

    align-self: end;

    overflow: hidden;

    color: var(--text);

    font-size: 14px;
    font-weight: 700;

    line-height: 1.1;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   META-ZEILE

   Untertitel links
   Modus + Status rechts
============================================================ */

.meta {
    grid-area: meta;

    min-width: 0;

    align-self: start;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;
}


.subtitle {
    min-width: 0;

    overflow: hidden;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.1;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.state-group {
    flex: 0 0 auto;

    display: flex;

    align-items: center;

    gap: 9px;

    min-width: 0;
}


.mode {
    color: var(--blue);

    font-size: 13px;
    font-weight: 650;

    line-height: 1.1;

    white-space: nowrap;
}


.mode.off {
    color: var(--muted);
}


.real-state {
    display: flex;

    align-items: center;

    gap: 5px;

    color: var(--text);

    font-size: 13px;

    line-height: 1.1;

    white-space: nowrap;
}


.state-dot {
    flex: 0 0 auto;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: var(--grey);
}


.state-dot.on {
    background: var(--green);
}


/* ============================================================
   LEISTUNG
============================================================ */

.power {
    grid-area: power;

    align-self: end;

    color: var(--text);

    font-size: 14px;
    font-weight: 700;

    line-height: 1.1;

    text-align: right;

    white-space: nowrap;
}


/* ============================================================
   ZAHNRAD
============================================================ */

.gear {
    grid-area: gear;

    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    padding: 0;

    border:
        1px solid
        var(--line);

    border-radius: 10px;

    background: transparent;

    color: var(--text);

    font-size: 19px;

    line-height: 1;
}


/* ============================================================
   DESKTOP / LAPTOP
   MINDESTSCHRIFT 13 PX
============================================================ */

@media
    (hover: hover)
    and
    (pointer: fine)
{

    .consumers {
        padding-top: 52px;
    }


    .consumer-row {
        grid-template-columns:
            44px
            minmax(0, 1fr)
            72px
            40px;

        column-gap: 7px;

        padding:
            4px
            6px;

        border-radius: 11px;
    }


    .icon-box {
        width: 38px;
        height: 38px;

        border-radius: 9px;
    }


    .icon {
        font-size: 25px;
    }


    .name {
        font-size: 13px;
    }


    .subtitle,
    .mode,
    .real-state {
        font-size: 13px;
    }


    .power {
        font-size: 13px;
    }


    .gear {
        width: 35px;
        height: 35px;

        font-size: 18px;
    }

}


/* ============================================================
   MOBILE
   MINDESTSCHRIFT 12 PX
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
{

    .consumers {
        padding:
            52px
            9px
            9px
            9px;

        gap: 5px;
    }


    .consumer-row {
        grid-template-columns:
            50px
            minmax(0, 1fr)
            76px
            45px;

        column-gap: 8px;

        padding:
            5px
            7px;

        border-radius: 13px;
    }


    .icon-box {
        width: 44px;
        height: 44px;
    }


    .icon {
        font-size: 30px;
    }


    .name {
        font-size: 14px;
    }


    .subtitle {
        font-size: 12px;
    }


    .mode {
        font-size: 12px;
    }


    .real-state {
        font-size: 12px;
    }


    .power {
        font-size: 14px;
    }


    .gear {
        width: 40px;
        height: 40px;

        font-size: 20px;
    }

}


/* ============================================================
   SCHMALERES MOBILE

   Nicht kleiner als 12 px.
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
    and
    (max-width: 430px)
{

    .consumers {
        padding:
            50px
            6px
            7px
            6px;

        gap: 4px;
    }


    .consumer-row {
        grid-template-columns:
            43px
            minmax(0, 1fr)
            62px
            37px;

        column-gap: 5px;

        padding:
            4px
            5px;

        border-radius: 11px;
    }


    .icon-box {
        width: 38px;
        height: 38px;
    }


    .icon {
        font-size: 26px;
    }


    .name {
        font-size: 13px;
    }


    .meta {
        gap: 5px;
    }


    .state-group {
        gap: 5px;
    }


    .subtitle,
    .mode,
    .real-state {
        font-size: 12px;
    }


    .real-state {
        gap: 3px;
    }


    /*
     * Auf sehr schmalen Displays "Gerät" sparen.
     */
    .state-prefix {
        display: none;
    }


    .power {
        font-size: 13px;
    }


    .gear {
        width: 34px;
        height: 34px;

        font-size: 17px;
    }

}


/* ============================================================
   GROSSE DESKTOPANSICHT
============================================================ */

@media
    (hover: hover)
    and
    (pointer: fine)
    and
    (min-height: 560px)
{

    .consumers {
        padding:
            56px
            16px
            16px
            16px;

        gap: 8px;
    }


    .consumer-row {
        grid-template-columns:
            62px
            minmax(0, 1fr)
            105px
            58px;

        column-gap: 14px;

        padding:
            9px
            12px;

        border-radius: 15px;
    }


    .icon-box {
        width: 54px;
        height: 54px;

        border-radius: 13px;
    }


    .icon {
        font-size: 38px;
    }


    .name {
        font-size: 18px;
    }


    .subtitle {
        font-size: 14px;
    }


    .mode {
        font-size: 15px;
    }


    .real-state {
        font-size: 14px;
    }


    .power {
        font-size: 18px;
    }


    .gear {
        width: 50px;
        height: 50px;

        font-size: 24px;
    }

}

</style>

</head>


<body>


<div class="consumers">


    <!-- ========================================================
         ENTFEUCHTER UG
    ========================================================= -->

    <div class="consumer-row">

        <div class="icon-box">
            <div class="icon blue">♧</div>
        </div>

        <div class="name">
            Entfeuchter UG
        </div>

        <div class="meta">

            <div class="subtitle">
                Untergeschoss
            </div>

            <div class="state-group">

                <div
                    class="mode"
                    id="ug-mode"
                >
                    —
                </div>

                <div class="real-state">

                    <span
                        class="state-dot"
                        id="ug-dot"
                    ></span>

                    <span>
                        <span class="state-prefix">Gerät </span><span id="ug-state">—</span>
                    </span>

                </div>

            </div>

        </div>

        <div
            class="power"
            id="ug-power"
        >
            —
        </div>

        <button
            type="button"
            class="gear"
        >
            ⚙
        </button>

    </div>



    <!-- ========================================================
         ENTFEUCHTER OG
    ========================================================= -->

    <div class="consumer-row">

        <div class="icon-box">
            <div class="icon blue">♧</div>
        </div>

        <div class="name">
            Entfeuchter OG
        </div>

        <div class="meta">

            <div class="subtitle">
                Obergeschoss
            </div>

            <div class="state-group">

                <div
                    class="mode"
                    id="og-mode"
                >
                    —
                </div>

                <div class="real-state">

                    <span
                        class="state-dot"
                        id="og-dot"
                    ></span>

                    <span>
                        <span class="state-prefix">Gerät </span><span id="og-state">—</span>
                    </span>

                </div>

            </div>

        </div>

        <div
            class="power"
            id="og-power"
        >
            —
        </div>

        <button
            type="button"
            class="gear"
        >
            ⚙
        </button>

    </div>



    <!-- ========================================================
         POOL
    ========================================================= -->

    <div class="consumer-row">

        <div class="icon-box">
            <div class="icon blue">≋</div>
        </div>

        <div class="name">
            Poolpumpe + Salzelektrolyse
        </div>

        <div class="meta">

            <div class="subtitle">
                Pooltechnik
            </div>

            <div class="state-group">

                <div
                    class="mode"
                    id="pool-mode"
                >
                    —
                </div>

                <div class="real-state">

                    <span
                        class="state-dot"
                        id="pool-dot"
                    ></span>

                    <span>
                        <span class="state-prefix">Gerät </span><span id="pool-state">—</span>
                    </span>

                </div>

            </div>

        </div>

        <div
            class="power"
            id="pool-power"
        >
            —
        </div>

        <button
            type="button"
            class="gear"
        >
            ⚙
        </button>

    </div>



    <!-- ========================================================
         BOILER
    ========================================================= -->

    <div class="consumer-row">

        <div class="icon-box">
            <div class="icon orange">◉</div>
        </div>

        <div class="name">
            Boiler
        </div>

        <div class="meta">

            <div class="subtitle">
                Warmwasser
            </div>

            <div class="state-group">

                <div
                    class="mode"
                    id="boiler-mode"
                >
                    —
                </div>

                <div class="real-state">

                    <span
                        class="state-dot"
                        id="boiler-dot"
                    ></span>

                    <span>
                        <span class="state-prefix">Gerät </span><span id="boiler-state">—</span>
                    </span>

                </div>

            </div>

        </div>

        <div
            class="power"
            id="boiler-power"
        >
            —
        </div>

        <button
            type="button"
            class="gear"
        >
            ⚙
        </button>

    </div>



    <!-- ========================================================
         HEIZSTAB / PUFFER
    ========================================================= -->

    <div class="consumer-row">

        <div class="icon-box">
            <div class="icon orange">▥</div>
        </div>

        <div class="name">
            Heizstab / Puffer
        </div>

        <div class="meta">

            <div class="subtitle">
                Heizung
            </div>

            <div class="state-group">

                <div
                    class="mode"
                    id="heater-mode"
                >
                    —
                </div>

                <div class="real-state">

                    <span
                        class="state-dot"
                        id="heater-dot"
                    ></span>

                    <span>
                        <span class="state-prefix">Gerät </span><span id="heater-state">—</span>
                    </span>

                </div>

            </div>

        </div>

        <div
            class="power"
            id="heater-power"
        >
            —
        </div>

        <button
            type="button"
            class="gear"
        >
            ⚙
        </button>

    </div>


</div>



<script>

/* ============================================================
   HELPERS
============================================================ */

function setText(
    id,
    value
) {

    const element =
        document.getElementById(
            id
        );

    if (!element) {
        return;
    }

    element.textContent =
        value;
}


function modeText(
    value
) {

    const mode =
        Number(value);


    if (mode === 1) {
        return "Automatik";
    }


    if (mode === 2) {
        return "Erzwungen Ein";
    }


    return "Aus";
}


function powerText(
    value
) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return "—";
    }


    const number =
        Number(value);


    if (
        Math.abs(number) < 1
    ) {

        return (
            Math.round(
                number * 1000
            ) +
            " W"
        );
    }


    return (
        number.toFixed(1) +
        " kW"
    );
}


/* ============================================================
   VERBRAUCHER AKTUALISIEREN
============================================================ */

function updateConsumer(
    key,
    data
) {

    if (!data) {
        return;
    }


    const mode =
        Number(
            data.mode
        );


    const active =
        Boolean(
            data.active
        );


    setText(
        key + "-mode",
        modeText(
            mode
        )
    );


    /*
     * Nur Ein/Aus setzen.
     * "Gerät" steht separat im HTML.
     */

    setText(
        key + "-state",
        active
            ? "Ein"
            : "Aus"
    );


    setText(
        key + "-power",
        powerText(
            data.power
        )
    );


    const modeElement =
        document.getElementById(
            key + "-mode"
        );


    if (modeElement) {

        modeElement.classList.toggle(
            "off",
            mode === 0
        );

    }


    const dot =
        document.getElementById(
            key + "-dot"
        );


    if (dot) {

        dot.classList.toggle(
            "on",
            active
        );

    }

}


/* ============================================================
   LIVE UPDATE
============================================================ */

function handleMessage(data) {

    if (!data) {
        return;
    }


    if (
        typeof data ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }

    }


    updateConsumer(
        "ug",
        data.ug
    );


    updateConsumer(
        "og",
        data.og
    );


    updateConsumer(
        "pool",
        data.pool
    );


    updateConsumer(
        "boiler",
        data.boiler
    );


    updateConsumer(
        "heater",
        data.heater
    );

}


/* ============================================================
   INITIALISIERUNG
============================================================ */

window.addEventListener(
    "load",
    function () {

        if (
            typeof requestAction ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );

        }

    }
);

</script>

</body>

</html>
