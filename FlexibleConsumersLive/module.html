<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<style>

* {
    box-sizing: border-box;
}


/* ============================================================
   THEME
============================================================ */

:root {
    color-scheme: light dark;

    --text: #20262b;
    --muted: #7c878d;

    --line: rgba(0, 0, 0, 0.14);

    --row-bg: rgba(0, 0, 0, 0.015);
    --icon-bg: rgba(0, 0, 0, 0.015);

    --blue: #2196f3;
    --orange: #f5a623;
    --green: #17c989;
    --grey: #9aa6af;
}


@media (prefers-color-scheme: dark) {

    :root {
        --text: #f1f4f6;
        --muted: #a6adb3;

        --line: rgba(255, 255, 255, 0.15);

        --row-bg: rgba(255, 255, 255, 0.018);
        --icon-bg: rgba(255, 255, 255, 0.018);

        --blue: #38a9ff;
        --orange: #ffad2f;
        --green: #1bd491;
        --grey: #9ba6ae;
    }

}


/* ============================================================
   BASIS
============================================================ */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/*
 * Der Symcon-Titel liegt oberhalb.
 * Darunter müssen alle fünf Zeilen sicher Platz finden.
 */

.consumers {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows:
        repeat(
            5,
            minmax(0, 1fr)
        );

    gap: 4px;

    padding:
        34px
        8px
        7px
        8px;

    overflow: hidden;
}


/* ============================================================
   VERBRAUCHERZEILE
============================================================ */

.consumer-row {
    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-columns:
        46px
        minmax(0, 1.65fr)
        minmax(105px, 1.05fr)
        69px
        40px;

    column-gap: 6px;

    align-items: center;

    padding:
        3px
        5px;

    border:
        1px solid
        var(--line);

    border-radius: 11px;

    background:
        var(--row-bg);

    overflow: hidden;
}


/* ============================================================
   SYMBOL
============================================================ */

.consumer-icon-box {
    width: 39px;
    height: 39px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    border:
        1px solid
        var(--line);

    border-radius: 10px;

    background:
        var(--icon-bg);
}


.consumer-icon {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 30px;
    height: 30px;

    font-size: 27px;

    line-height: 1;
}


.consumer-icon.blue {
    color: var(--blue);
}


.consumer-icon.orange {
    color: var(--orange);
}


/* ============================================================
   NAME / UNTERTITEL
============================================================ */

.consumer-name-area {
    min-width: 0;
}


.consumer-name {
    overflow: hidden;

    color: var(--text);

    font-size: 13px;
    font-weight: 700;

    line-height: 1.1;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.consumer-subtitle {
    margin-top: 2px;

    overflow: hidden;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.05;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   MODUS / STATUS
============================================================ */

.consumer-state-area {
    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: flex-start;
}


.consumer-mode {
    max-width: 100%;

    overflow: hidden;

    color: var(--blue);

    font-size: 13px;
    font-weight: 650;

    line-height: 1.05;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.consumer-mode.off {
    color: var(--muted);
}


.consumer-real-state {
    margin-top: 3px;

    max-width: 100%;

    display: flex;

    align-items: center;

    gap: 5px;

    overflow: hidden;

    color: var(--text);

    font-size: 13px;

    line-height: 1.05;

    white-space: nowrap;
}


.consumer-real-state-text {
    overflow: hidden;

    text-overflow: ellipsis;
}


.state-dot {
    flex: 0 0 auto;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: var(--grey);
}


.state-dot.on {
    background: var(--green);

    box-shadow:
        0 0 5px
        rgba(27, 212, 145, 0.35);
}


/* ============================================================
   LEISTUNG
============================================================ */

.consumer-power {
    overflow: hidden;

    color: var(--text);

    font-size: 13px;
    font-weight: 700;

    line-height: 1;

    text-align: right;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   ZAHNRAD
============================================================ */

.settings-button {
    width: 36px;
    height: 36px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    padding: 0;

    border:
        1px solid
        var(--line);

    border-radius: 10px;

    background: transparent;

    color: var(--text);

    font-size: 19px;

    line-height: 1;

    cursor: pointer;
}


.settings-button:active {
    transform: scale(0.96);
}


/* ============================================================
   LAPTOP / DESKTOP
============================================================ */

@media
    (hover: hover)
    and
    (pointer: fine)
{

    /*
     * Feste Erkenntnis aus unserem Schriftgrössen-Test:
     * Desktop/Laptop nie unter 13 px.
     */

    .consumer-name,
    .consumer-subtitle,
    .consumer-mode,
    .consumer-real-state,
    .consumer-power {
        font-size: 13px;
    }

}


/* ============================================================
   GROSSE DESKTOPANSICHT
============================================================ */

@media
    (hover: hover)
    and
    (pointer: fine)
    and
    (min-height: 560px)
{

    .consumers {
        gap: 7px;

        padding:
            46px
            14px
            14px
            14px;
    }


    .consumer-row {
        grid-template-columns:
            62px
            minmax(0, 1.7fr)
            minmax(145px, 1.1fr)
            100px
            56px;

        column-gap: 12px;

        padding:
            7px
            10px;

        border-radius: 14px;
    }


    .consumer-icon-box {
        width: 52px;
        height: 52px;

        border-radius: 13px;
    }


    .consumer-icon {
        width: 40px;
        height: 40px;

        font-size: 36px;
    }


    .consumer-name {
        font-size: 17px;
    }


    .consumer-subtitle {
        margin-top: 4px;

        font-size: 14px;
    }


    .consumer-mode {
        font-size: 15px;
    }


    .consumer-real-state {
        margin-top: 5px;

        font-size: 14px;
    }


    .state-dot {
        width: 12px;
        height: 12px;
    }


    .consumer-power {
        font-size: 17px;
    }


    .settings-button {
        width: 47px;
        height: 47px;

        font-size: 23px;

        border-radius: 12px;
    }

}


/* ============================================================
   MOBILE

   WICHTIG:
   - keine pauschale Vergrösserung aller Abstände
   - alle 5 Zeilen müssen weiterhin passen
   - kleinste Schrift mindestens 12 px
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
{

    .consumers {
        gap: 5px;

        /*
         * Genügend Abstand zum Symcon-Titel,
         * aber nicht unnötig viel Höhe verschwenden.
         */
        padding:
            40px
            8px
            8px
            8px;
    }


    .consumer-row {
        grid-template-columns:
            51px
            minmax(0, 1.55fr)
            minmax(104px, 1.05fr)
            69px
            43px;

        column-gap: 6px;

        padding:
            4px
            6px;

        border-radius: 12px;
    }


    .consumer-icon-box {
        width: 44px;
        height: 44px;

        border-radius: 11px;
    }


    .consumer-icon {
        width: 34px;
        height: 34px;

        font-size: 30px;
    }


    .consumer-name {
        font-size: 14px;
    }


    /*
     * Mobile:
     * Schrift-Test Zeile 05 = 12 px.
     */

    .consumer-subtitle {
        margin-top: 2px;

        font-size: 12px;
    }


    .consumer-mode {
        font-size: 12px;
    }


    .consumer-real-state {
        margin-top: 3px;

        gap: 5px;

        font-size: 12px;
    }


    .state-dot {
        width: 11px;
        height: 11px;
    }


    .consumer-power {
        font-size: 14px;
    }


    .settings-button {
        width: 40px;
        height: 40px;

        font-size: 20px;
    }

}


/* ============================================================
   SEHR SCHMALES MOBILE

   Auch hier:
   NIE UNTER 12 px.
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
    and
    (max-width: 430px)
{

    .consumers {
        gap: 4px;

        padding:
            39px
            5px
            6px
            5px;
    }


    .consumer-row {
        grid-template-columns:
            45px
            minmax(0, 1.5fr)
            minmax(91px, 1fr)
            61px
            39px;

        column-gap: 4px;

        padding:
            3px
            4px;

        border-radius: 11px;
    }


    .consumer-icon-box {
        width: 40px;
        height: 40px;
    }


    .consumer-icon {
        width: 31px;
        height: 31px;

        font-size: 27px;
    }


    .consumer-name {
        font-size: 13px;
    }


    .consumer-subtitle,
    .consumer-mode,
    .consumer-real-state {
        font-size: 12px;
    }


    .consumer-real-state {
        gap: 4px;
    }


    .state-dot {
        width: 10px;
        height: 10px;
    }


    .consumer-power {
        font-size: 13px;
    }


    .settings-button {
        width: 36px;
        height: 36px;

        font-size: 18px;
    }

}

</style>

</head>


<body>

<script>

/* ============================================================
   HILFSFUNKTIONEN
============================================================ */

function setText(
    id,
    value
) {

    const element =
        document.getElementById(id);


    if (!element) {
        return;
    }


    element.textContent =
        value ?? "—";
}



function formatPower(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return "—";
    }


    const number =
        Number(value);


    /*
     * Die festen Verbraucherleistungen im EMS
     * werden in kW geführt:
     *
     * 0.5 => 500 W
     * 6   => 6.0 kW
     */

    if (
        Math.abs(number) < 1
    ) {

        return (
            Math.round(
                number * 1000
            ) +
            " W"
        );
    }


    return (
        number.toFixed(1) +
        " kW"
    );
}



function formatMode(
    value
) {

    /*
     * 0 = Aus
     * 1 = Automatik
     * 2 = Erzwungen Ein
     */

    const mode =
        Number(value);


    if (mode === 1) {
        return "Automatik";
    }


    if (mode === 2) {
        return "Erzwungen Ein";
    }


    return "Aus";
}


/* ============================================================
   DATENSTRUKTUR ROBUST LESEN
============================================================ */

function findConsumer(
    data,
    key,
    aliases
) {

    const names =
        [
            key,
            ...aliases
        ];


    /*
     * data.consumers als Objekt
     */

    if (
        data.consumers &&
        typeof data.consumers === "object" &&
        !Array.isArray(
            data.consumers
        )
    ) {

        for (
            const name of names
        ) {

            if (
                data.consumers[name] &&
                typeof data.consumers[name] === "object"
            ) {
                return data.consumers[name];
            }

        }

    }


    /*
     * direktes Objekt
     */

    for (
        const name of names
    ) {

        if (
            data[name] &&
            typeof data[name] === "object"
        ) {
            return data[name];
        }

    }


    /*
     * Array
     */

    const list =
        Array.isArray(data)
            ? data
            : (
                Array.isArray(data.consumers)
                    ? data.consumers
                    : null
            );


    if (list) {

        for (
            const item of list
        ) {

            if (!item) {
                continue;
            }


            const itemKey =
                String(
                    item.key ??
                    item.ident ??
                    item.id ??
                    item.name ??
                    ""
                ).toLowerCase();


            for (
                const name of names
            ) {

                if (
                    itemKey ===
                    String(name)
                        .toLowerCase()
                ) {
                    return item;
                }

            }

        }

    }


    return null;
}


/* ============================================================
   EINEN VERBRAUCHER DARSTELLEN
============================================================ */

function updateConsumer(
    key,
    consumer
) {

    if (!consumer) {
        return;
    }


    const mode =
        consumer.mode ??
        consumer.Mode ??
        consumer.operationMode ??
        consumer.betriebsart ??
        0;


    const active =
        Boolean(
            consumer.active ??
            consumer.status ??
            consumer.on ??
            consumer.state ??
            false
        );


    const power =
        consumer.power ??
        consumer.Power ??
        consumer.configuredPower ??
        consumer.leistung ??
        null;


    setText(
        key + "-mode",
        formatMode(mode)
    );


    const modeElement =
        document.getElementById(
            key + "-mode"
        );


    if (modeElement) {

        modeElement.classList.toggle(
            "off",
            Number(mode) === 0
        );

    }


    setText(
        key + "-state",
        active
            ? "Gerät Ein"
            : "Gerät Aus"
    );


    const dot =
        document.getElementById(
            key + "-dot"
        );


    if (dot) {

        dot.classList.toggle(
            "on",
            active
        );

    }


    setText(
        key + "-power",
        formatPower(power)
    );

}


/* ============================================================
   LIVE UPDATE
============================================================ */

function handleMessage(data) {

    if (
        typeof data === "string"
    ) {

        try {

            data =
                JSON.parse(data);

        } catch (error) {

            return;
        }

    }


    if (
        !data ||
        typeof data !== "object"
    ) {
        return;
    }


    updateConsumer(
        "ug",
        findConsumer(
            data,
            "ug",
            [
                "entfeuchterUG",
                "Entfeuchter UG"
            ]
        )
    );


    updateConsumer(
        "og",
        findConsumer(
            data,
            "og",
            [
                "entfeuchterOG",
                "Entfeuchter OG"
            ]
        )
    );


    updateConsumer(
        "pool",
        findConsumer(
            data,
            "pool",
            [
                "poolpumpe",
                "Poolpumpe + Salzelektrolyse"
            ]
        )
    );


    updateConsumer(
        "boiler",
        findConsumer(
            data,
            "boiler",
            [
                "Boiler"
            ]
        )
    );


    updateConsumer(
        "heater",
        findConsumer(
            data,
            "heater",
            [
                "heizstab",
                "puffer",
                "Heizstab / Puffer"
            ]
        )
    );

}


/* ============================================================
   ZAHNRAD
============================================================ */

document
    .querySelectorAll(
        ".settings-button"
    )
    .forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    if (
                        typeof requestAction !== "function"
                    ) {
                        return;
                    }


                    requestAction(
                        "OpenConfig",
                        button.dataset.key
                    );

                }
            );

        }
    );


/* ============================================================
   INITIALISIERUNG
============================================================ */

window.addEventListener(
    "load",
    function () {

        if (
            typeof requestAction === "function"
        ) {

            requestAction(
                "Refresh",
                true
            );

        }

    }
);

</script>
