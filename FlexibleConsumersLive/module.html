<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
:root{color-scheme:light dark;--text:#171a1c;--muted:#727b81;--line:#d7dadd;--row:#fff;--blue:#168ff0;--orange:#f3a11a;--green:#12bd7f;--grey:#9ba6ad}
@media(prefers-color-scheme:dark){:root{--text:#f1f4f6;--muted:#a8b0b6;--line:rgba(255,255,255,.16);--row:rgba(255,255,255,.035);--blue:#38a9ff;--orange:#ffad2f;--green:#22d695;--grey:#a4adb6}}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.list{height:100%;padding:2.7rem .5rem .5rem;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:.34rem;overflow:hidden}
.row{min-width:0;min-height:0;display:grid;grid-template-columns:3.25rem minmax(8rem,1fr) 7.8rem 5.4rem 2.7rem;align-items:center;gap:.5rem;padding:.25rem .45rem;border:1px solid var(--line);border-radius:.82rem;background:var(--row);overflow:hidden}
.cell{min-width:0;display:flex;align-items:center}.icon-cell,.gear-cell{justify-content:center}
.icon-box{width:2.65rem;height:2.65rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:.72rem}.icon-box svg{width:1.72rem;height:1.72rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.blue{color:var(--blue)}.orange{color:var(--orange)}
.name-col,.state-col{min-width:0;display:flex;flex-direction:column;justify-content:center}.name,.sub,.mode,.status-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name{font-size:14px;font-weight:700;line-height:1.15}.sub{margin-top:.14rem;color:var(--muted);font-size:13px;line-height:1.1}
.mode{color:var(--blue);font-size:13px;font-weight:650;line-height:1.1}.mode.off{color:var(--muted)}.status-line{margin-top:.14rem;display:flex;align-items:center;gap:.35rem;color:var(--text);font-size:13px;line-height:1.1}.status-line.max-temp{color:var(--orange);font-weight:650}.dot{width:.7rem;height:.7rem;flex:0 0 auto;border-radius:50%;background:var(--grey)}.dot.on{background:var(--green)}.dot.max-temp{background:var(--orange)}
.power-cell{justify-content:flex-end}.power{font-size:14px;font-weight:700;white-space:nowrap;text-align:right}
.gear{width:2.35rem;height:2.35rem;padding:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:.7rem;background:transparent;color:var(--text);cursor:pointer}.gear svg{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.gear:active{transform:scale(.94)}.gear:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.gear:disabled{opacity:.35;cursor:default}
@media(max-width:600px){.list{padding:2.65rem .38rem .38rem;gap:.28rem}.row{grid-template-columns:2.85rem minmax(5.5rem,1fr) 6.65rem 4.3rem 2.25rem;gap:.28rem;padding:.18rem .28rem}.icon-box{width:2.32rem;height:2.32rem}.icon-box svg{width:1.58rem;height:1.58rem}.name{font-size:13px}.sub,.mode,.status-line{font-size:12px}.power{font-size:13px}.gear{width:2.05rem;height:2.05rem}.gear svg{width:1.15rem;height:1.15rem}}
@media(max-width:390px){.row{grid-template-columns:2.65rem minmax(4.7rem,1fr) 6.1rem 3.9rem 2.1rem;gap:.2rem;padding-inline:.22rem}.icon-box{width:2.18rem;height:2.18rem}.sub{font-size:11px}.state-col{min-width:0}.gear{width:1.95rem;height:1.95rem}}
</style>
</head>
<body>
<main class="list" id="consumer-list"></main>
<script>
const initialData=__SULZFC_INITIAL_DATA__;
const definitions={
 ug:{name:'Entfeuchter UG',sub:'Untergeschoss',icon:'dehumidifier',color:'blue'},
 og:{name:'Entfeuchter OG',sub:'Obergeschoss',icon:'dehumidifier',color:'blue'},
 pool:{name:'Poolpumpe',sub:'Pooltechnik',icon:'pool',color:'blue'},
 boiler:{name:'Boiler',sub:'Warmwasser',icon:'boiler',color:'orange'},
 heater:{name:'Heizstab / Puffer',sub:'Heizung',icon:'heater',color:'orange'}
};
const icons={
 dehumidifier:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-2.1 2.8-3.2 4.6-3.2 6.2a3.2 3.2 0 0 0 6.4 0C15.2 7.6 14.1 5.8 12 3Z"/><path d="M8.5 11.5H7a4 4 0 0 0 0 8h3M15.5 11.5H17a4 4 0 0 1 0 8h-3M12 13v8"/></svg>',
 pool:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7c2.2-2.2 4.3-2.2 6.5 0s4.3 2.2 6.5 0 4.3-2.2 5 0M3 12c2.2-2.2 4.3-2.2 6.5 0s4.3 2.2 6.5 0 4.3-2.2 5 0M3 17c2.2-2.2 4.3-2.2 6.5 0s4.3 2.2 6.5 0 4.3-2.2 5 0"/></svg>',
 boiler:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="9.5"/></svg>',
 heater:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="1"/><path d="M9 5v14M12 5v14M15 5v14"/></svg>',
 gear:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>'
};
const list=document.getElementById('consumer-list');
let data={consumers:{}};

function escapeText(value){return String(value??'—')}
function rowMarkup(key,d){return `<section class="row" data-key="${key}"><div class="cell icon-cell"><div class="icon-box ${d.color}">${icons[d.icon]}</div></div><div class="cell"><div class="name-col"><div class="name">${d.name}</div><div class="sub">${d.sub}</div></div></div><div class="cell"><div class="state-col"><div class="mode" id="${key}-mode">—</div><div class="status-line" id="${key}-status-line"><span class="dot" id="${key}-dot"></span><span class="status-text" id="${key}-state">—</span></div></div></div><div class="cell power-cell"><div class="power" id="${key}-power">—</div></div><div class="cell gear-cell"><button class="gear" data-settings="${key}" type="button" aria-label="Einstellungen ${d.name}" disabled>${icons.gear}</button></div></section>`}
list.innerHTML=Object.entries(definitions).map(([key,d])=>rowMarkup(key,d)).join('');

function modeText(value){const modes={0:'Aus',1:'Automatik',2:'Ein',3:'Manuell'};return modes[value]??(value==null?'—':String(value))}
function formatPower(value){if(value==null||!Number.isFinite(Number(value)))return '—';const n=Number(value);return Math.abs(n)>=1000?`${(n/1000).toFixed(1)} kW`:`${Math.round(n)} W`}
function mergeValid(base,next){if(!next||typeof next!=='object')return base;const out={...base};for(const [key,value] of Object.entries(next)){if(value===null||value===undefined)continue;out[key]=typeof value==='object'&&!Array.isArray(value)?mergeValid(base?.[key]||{},value):value}return out}
function hasCoreData(){return Object.values(data.consumers||{}).some(c=>c&&[c.mode,c.active,c.power,c.reason].some(v=>v!==null&&v!==undefined))}
function render(){for(const key of Object.keys(definitions)){const c=data.consumers?.[key]||{};const mode=document.getElementById(`${key}-mode`);const line=document.getElementById(`${key}-status-line`);const dot=document.getElementById(`${key}-dot`);mode.textContent=modeText(c.mode);mode.classList.toggle('off',Number(c.mode)===0);const maximum=c.temperature!=null&&c.temperatureLimit!=null&&Number(c.temperature)>=Number(c.temperatureLimit);const active=Boolean(c.active);let state=escapeText(c.reason);if(!c.reason)state=maximum?'Temperaturlimit':(active?'Gerät Ein':'Gerät Aus');document.getElementById(`${key}-state`).textContent=state;document.getElementById(`${key}-power`).textContent=formatPower(c.power);dot.className=`dot${maximum?' max-temp':active?' on':''}`;line.classList.toggle('max-temp',maximum);const button=document.querySelector(`[data-settings="${key}"]`);button.disabled=!Number.isInteger(Number(c.settingsObjectID))||Number(c.settingsObjectID)<=0}}
function acceptPayload(payload){if(typeof payload==='string'){try{payload=JSON.parse(payload)}catch{return}}if(!payload||typeof payload!=='object')return;const normalized=payload.consumers?payload:{consumers:payload};data=mergeValid(data,normalized);render()}
function requestRefresh(){if(typeof requestAction==='function')requestAction('Refresh',true)}
function openSettings(key){const id=Number(data.consumers?.[key]?.settingsObjectID);if(!Number.isInteger(id)||id<=0)return;if(typeof openObject==='function')openObject(id)}
document.querySelectorAll('[data-settings]').forEach(button=>button.addEventListener('click',()=>openSettings(button.dataset.settings)));
window.handleMessage=acceptPayload;
acceptPayload(initialData);
if(!hasCoreData()){requestRefresh();setTimeout(()=>{if(!hasCoreData())requestRefresh()},500);setTimeout(()=>{if(!hasCoreData())requestRefresh()},1500)}
</script>
</body>
</html>
