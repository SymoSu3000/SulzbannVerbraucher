<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<style>

    /* ================================================================ */
    /* Farben                                                           */
    /* ================================================================ */

    :root {

        color-scheme:
            light dark;

        --accent:
            var(
                --accent-color,
                #18c7c0
            );

        --text:
            var(
                --content-color,
                #f2f4f6
            );

        --green:
            #20d17a;

        --blue:
            #39a8ff;

        --orange:
            #f5a623;

        --red:
            #ff6470;

        --grey:
            #9099a3;

        --muted:
            rgba(
                170,
                176,
                183,
                .92
            );

        --border:
            rgba(
                160,
                168,
                176,
                .24
            );

        --row-background:
            rgba(
                127,
                127,
                127,
                .035
            );
    }


    /* ================================================================ */
    /* Grundlayout                                                      */
    /* ================================================================ */

    * {

        box-sizing:
            border-box;
    }


    html,
    body {

        width:
            100%;

        height:
            100%;

        margin:
            0;

        padding:
            0;

        overflow:
            hidden;

        background:
            transparent;

        color:
            var(--text);

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;
    }


    button {

        font:
            inherit;
    }


    #app {

        width:
            100%;

        height:
            100%;

        padding:
            52px
            12px
            12px
            12px;

        overflow:
            hidden;
    }


    #consumerList {

        width:
            100%;

        height:
            100%;

        display:
            grid;

        grid-template-rows:
            repeat(
                5,
                minmax(
                    0,
                    1fr
                )
            );

        gap:
            7px;
    }


    /* ================================================================ */
    /* Verbraucherzeile                                                 */
    /* ================================================================ */

    .consumer {

        width:
            100%;

        min-width:
            0;

        min-height:
            0;

        overflow:
            hidden;

        display:
            grid;

        grid-template-columns:
            46px
            minmax(150px, 1.55fr)
            minmax(140px, 1.15fr)
            minmax(85px, .65fr)
            46px;

        grid-template-areas:
            "icon info state power gear";

        align-items:
            center;

        column-gap:
            11px;

        padding:
            7px
            10px;

        border:
            1px solid
            var(--border);

        border-radius:
            11px;

        background:
            var(--row-background);
    }


    /* ================================================================ */
    /* Icon                                                             */
    /* ================================================================ */

    .icon {

        grid-area:
            icon;

        width:
            40px;

        height:
            40px;

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        border:
            1px solid
            var(--border);

        border-radius:
            9px;

        color:
            var(--blue);
    }


    .consumer[data-key="boiler"] .icon {

        color:
            var(--orange);
    }


    .consumer[data-key="buffer"] .icon {

        color:
            var(--orange);
    }


    /* ================================================================ */
    /* Name                                                             */
    /* ================================================================ */

    .info {

        grid-area:
            info;

        min-width:
            0;
    }


    .name {

        overflow:
            hidden;

        text-overflow:
            ellipsis;

        white-space:
            nowrap;

        color:
            var(--text);

        font-size:
            15px;

        line-height:
            1.15;

        font-weight:
            700;
    }


    .sub {

        margin-top:
            3px;

        overflow:
            hidden;

        text-overflow:
            ellipsis;

        white-space:
            nowrap;

        color:
            var(--muted);

        font-size:
            11px;
    }


    /* ================================================================ */
    /* Statusblock                                                      */
    /* ================================================================ */

    .state {

        grid-area:
            state;

        min-width:
            0;
    }


    .mode {

        display:
            flex;

        align-items:
            center;

        gap:
            6px;

        min-width:
            0;

        overflow:
            hidden;

        font-size:
            13px;

        font-weight:
            700;

        line-height:
            1.15;
    }


    .mode-text {

        min-width:
            0;

        overflow:
            hidden;

        text-overflow:
            ellipsis;

        white-space:
            nowrap;
    }


    .mode.auto {

        color:
            var(--blue);
    }


    .mode.force {

        color:
            var(--green);
    }


    .mode.off {

        color:
            var(--grey);
    }


    .real-state {

        margin-top:
            5px;

        display:
            flex;

        align-items:
            center;

        gap:
            6px;

        min-width:
            0;

        font-size:
            12px;

        color:
            var(--text);
    }


    .state-dot {

        width:
            10px;

        height:
            10px;

        flex:
            0 0 10px;

        border-radius:
            50%;

        background:
            var(--grey);
    }


    .state-dot.on {

        background:
            var(--green);

        box-shadow:
            0 0 8px
            rgba(
                32,
                209,
                122,
                .40
            );
    }


    .reason {

        margin-top:
            4px;

        max-width:
            100%;

        overflow:
            hidden;

        text-overflow:
            ellipsis;

        white-space:
            nowrap;

        color:
            var(--muted);

        font-size:
            10px;
    }


    /* ================================================================ */
    /* Leistung                                                         */
    /* ================================================================ */

    .power {

        grid-area:
            power;

        text-align:
            right;

        white-space:
            nowrap;

        color:
            var(--text);

        font-size:
            15px;

        font-weight:
            750;
    }


    /* ================================================================ */
    /* Zahnrad                                                          */
    /* ================================================================ */

    .gear {

        grid-area:
            gear;

        justify-self:
            end;

        width:
            40px;

        height:
            40px;

        padding:
            0;

        margin:
            0;

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        border:
            1px solid
            var(--border);

        border-radius:
            9px;

        background:
            rgba(
                127,
                127,
                127,
                .045
            );

        color:
            var(--text);

        cursor:
            pointer;

        font-size:
            20px;
    }


    .gear:hover {

        color:
            var(--accent);

        border-color:
            var(--accent);
    }


    .gear:active {

        transform:
            scale(.94);
    }


    /* ================================================================ */
    /* Schmalere Ansicht                                                */
    /* ================================================================ */

    @media
    (
        max-width:
        720px
    ) {

        #app {

            padding-left:
                9px;

            padding-right:
                9px;

            padding-bottom:
                9px;
        }


        .consumer {

            grid-template-columns:
                42px
                minmax(0, 1fr)
                72px
                42px;

            grid-template-areas:
                "icon info power gear"
                "icon state power gear";

            row-gap:
                3px;

            column-gap:
                8px;

            padding:
                6px
                8px;
        }


        .icon {

            width:
                36px;

            height:
                36px;
        }


        .name {

            font-size:
                14px;
        }


        .sub {

            font-size:
                10px;
        }


        .mode {

            font-size:
                12px;
        }


        .real-state {

            margin-top:
                2px;

            font-size:
                11px;
        }


        .reason {

            display:
                none;
        }


        .power {

            font-size:
                14px;
        }


        .gear {

            width:
                36px;

            height:
                36px;

            font-size:
                18px;
        }
    }


    /* ================================================================ */
    /* Mobile                                                           */
    /* ================================================================ */

    @media
    (
        max-width:
        460px
    ) {

        #app {

            padding-top:
                49px;

            padding-left:
                8px;

            padding-right:
                8px;

            padding-bottom:
                8px;
        }


        #consumerList {

            gap:
                6px;
        }


        .consumer {

            grid-template-columns:
                38px
                minmax(0, 1fr)
                62px
                38px;

            grid-template-areas:
                "icon info power gear"
                "icon state power gear";

            column-gap:
                7px;

            padding:
                6px
                7px;
        }


        .icon {

            width:
                34px;

            height:
                34px;
        }


        .name {

            font-size:
                13px;
        }


        .sub {

            font-size:
                10px;
        }


        .mode {

            font-size:
                11px;
        }


        .real-state {

            font-size:
                10px;
        }


        .power {

            font-size:
                13px;
        }


        .gear {

            width:
                34px;

            height:
                34px;

            font-size:
                17px;
        }
    }


    /* ================================================================ */
    /* Flache Kachel                                                    */
    /* ================================================================ */

    @media
    (
        max-height:
        390px
    ) {

        #app {

            padding-top:
                45px;

            padding-bottom:
                7px;
        }


        #consumerList {

            gap:
                5px;
        }


        .consumer {

            padding-top:
                4px;

            padding-bottom:
                4px;
        }


        .sub {

            display:
                none;
        }


        .reason {

            display:
                none;
        }


        .icon {

            width:
                32px;

            height:
                32px;
        }


        .gear {

            width:
                32px;

            height:
                32px;

            font-size:
                17px;
        }


        .name {

            font-size:
                13px;
        }


        .mode {

            font-size:
                11px;
        }


        .real-state {

            font-size:
                10px;
        }


        .power {

            font-size:
                13px;
        }
    }

</style>

</head>


<body>


<div id="app">

    <div
        id="consumerList"
    ></div>

</div>



<script>

'use strict';


// ============================================================================
// Start
// ============================================================================

function init()
{
    try {

        requestAction(
            'Refresh',
            true
        );

    } catch (e) {

    }
}


// ============================================================================
// Nachricht von Symcon
// ============================================================================

function handleMessage(
    message
)
{
    let data =
        message;


    if (
        typeof data
        ===
        'string'
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (e) {

            return;
        }
    }


    if (
        !data
        ||
        data.type
        !==
        'consumers'
    ) {

        return;
    }


    renderConsumers(
        Array.isArray(
            data.items
        )
            ?
            data.items
            :
            []
    );
}


// ============================================================================
// Rendern
// ============================================================================

function renderConsumers(
    items
)
{
    const list =
        document.getElementById(
            'consumerList'
        );


    if (
        !list
    ) {

        return;
    }


    const html =
        [];


    for (
        const item
        of
        items
    ) {

        html.push(
            createConsumerHTML(
                item
            )
        );
    }


    list.innerHTML =
        html.join(
            ''
        );


    const buttons =
        list.querySelectorAll(
            '.gear'
        );


    buttons.forEach(
        button =>
        {
            button.addEventListener(
                'click',
                event =>
                {
                    event.stopPropagation();


                    const id =
                        Number(
                            button.dataset.objectId
                        );


                    if (
                        !Number.isFinite(
                            id
                        )
                        ||
                        id <= 0
                    ) {

                        return;
                    }


                    try {

                        openObject(
                            id
                        );

                    } catch (e) {

                        console.log(
                            'openObject nicht verfügbar',
                            e
                        );
                    }
                }
            );
        }
    );
}


// ============================================================================
// Einzelne Zeile
// ============================================================================

function createConsumerHTML(
    item
)
{
    const name =
        escapeHTML(
            item.name
            ||
            ''
        );


    const sub =
        escapeHTML(
            item.sub
            ||
            ''
        );


    const modeText =
        escapeHTML(
            item.modeText
            ||
            ''
        );


    const statusText =
        escapeHTML(
            item.statusText
            ||
            ''
        );


    const powerText =
        escapeHTML(
            item.powerText
            ||
            '—'
        );


    const reason =
        escapeHTML(
            item.reason
            ||
            ''
        );


    const objectID =
        Number(
            item.id
        )
        ||
        0;


    const modeClass =
        getModeClass(
            Number(
                item.modeRaw
            )
        );


    return `
        <div
            class="consumer"
            data-key="${escapeHTML(item.key || '')}"
        >

            <div class="icon">
                ${getIcon(item.icon)}
            </div>


            <div class="info">

                <div
                    class="name"
                    title="${name}"
                >
                    ${name}
                </div>


                <div
                    class="sub"
                    title="${sub}"
                >
                    ${sub}
                </div>

            </div>


            <div class="state">

                <div
                    class="mode ${modeClass}"
                    title="${modeText}"
                >

                    <span class="mode-text">
                        ${modeText}
                    </span>

                </div>


                <div class="real-state">

                    <span
                        class="state-dot ${item.isOn ? 'on' : ''}"
                    ></span>

                    <span>
                        Gerät ${statusText}
                    </span>

                </div>


                <div
                    class="reason"
                    title="${reason}"
                >
                    ${reason}
                </div>

            </div>


            <div
                class="power"
                title="Konfigurierte EMS-Leistung: ${powerText}"
            >
                ${powerText}
            </div>


            <button
                class="gear"
                type="button"
                data-object-id="${objectID}"
                title="Einstellungen öffnen"
                aria-label="Einstellungen ${name}"
            >
                ⚙
            </button>

        </div>
    `;
}


// ============================================================================
// Farbe Betriebsart
// ============================================================================

function getModeClass(
    mode
)
{
    switch (
        mode
    ) {

        case 0:

            return
                'off';


        case 1:

            return
                'auto';


        case 2:

            return
                'force';


        default:

            return
                '';
    }
}


// ============================================================================
// Icons
// ============================================================================

function getIcon(
    icon
)
{
    switch (
        icon
    ) {

        case 'boiler':

            return `
                <svg
                    viewBox="0 0 32 32"
                    width="26"
                    height="26"
                >
                    <rect
                        x="9"
                        y="4"
                        width="14"
                        height="24"
                        rx="4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.3"
                    />

                    <path
                        d="M16 11 C13 15 12 17 12 19 A4 4 0 0 0 20 19 C20 17 19 15 16 11Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    />
                </svg>
            `;


        case 'drop':

            return `
                <svg
                    viewBox="0 0 32 32"
                    width="27"
                    height="27"
                >
                    <path
                        d="M16 3 C11 10 7 15 7 20 A9 9 0 0 0 25 20 C25 15 21 10 16 3Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linejoin="round"
                    />
                </svg>
            `;


        case 'pool':

            return `
                <svg
                    viewBox="0 0 32 32"
                    width="28"
                    height="28"
                >
                    <path
                        d="M5 11 H11 V4 M11 8 H18 V4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                    />

                    <path
                        d="M3 17 C6 14 9 20 12 17 C15 14 18 20 21 17 C24 14 27 20 30 17"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                    />

                    <path
                        d="M3 23 C6 20 9 26 12 23 C15 20 18 26 21 23 C24 20 27 26 30 23"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                    />
                </svg>
            `;


        case 'heater':

            return `
                <svg
                    viewBox="0 0 32 32"
                    width="27"
                    height="27"
                >
                    <rect
                        x="7"
                        y="5"
                        width="18"
                        height="22"
                        rx="2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.3"
                    />

                    <path
                        d="M11 9 V23 M16 9 V23 M21 9 V23"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    />
                </svg>
            `;


        default:

            return
                '●';
    }
}


// ============================================================================
// HTML escapen
// ============================================================================

function escapeHTML(
    value
)
{
    return String(
        value
        ??
        ''
    )
    .replaceAll(
        '&',
        '&amp;'
    )
    .replaceAll(
        '<',
        '&lt;'
    )
    .replaceAll(
        '>',
        '&gt;'
    )
    .replaceAll(
        '"',
        '&quot;'
    )
    .replaceAll(
        "'",
        '&#039;'
    );
}


// ============================================================================
// Start
// ============================================================================

document.addEventListener(
    'DOMContentLoaded',
    init
);

</script>


</body>

</html>
