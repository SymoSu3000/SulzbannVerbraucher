<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<style>

* {
    box-sizing: border-box;
}

:root {
    color-scheme: light dark;

    --text: #20262b;
    --muted: #7d878d;

    --line: rgba(0, 0, 0, 0.14);
    --row-bg: rgba(0, 0, 0, 0.015);

    --blue: #2196f3;
    --orange: #f4a321;
    --green: #19c989;
    --grey: #9ca7af;
    --test: #d81b60;
}


@media (prefers-color-scheme: dark) {

    :root {
        --text: #f1f4f6;
        --muted: #a7afb5;

        --line: rgba(255, 255, 255, 0.15);
        --row-bg: rgba(255, 255, 255, 0.018);

        --blue: #38a9ff;
        --orange: #ffad2f;
        --green: #1bd491;
        --grey: #9ca7af;
        --test: #ff5a9d;
    }

}


html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* ============================================================
   KACHEL
============================================================ */

.consumers {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows:
        repeat(5, minmax(0, 1fr));

    gap: 6px;

    padding:
        54px
        10px
        10px
        10px;

    overflow: hidden;
}


/* ============================================================
   ZEILE
============================================================ */

.consumer-row {
    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-columns:
        52px
        minmax(0, 1fr)
        120px
        78px
        44px;

    column-gap: 8px;

    align-items: center;

    padding:
        6px
        8px;

    border:
        2px solid
        var(--line);

    border-radius: 14px;

    background:
        var(--row-bg);

    overflow: hidden;

    position: relative;
}


/* ============================================================
   SICHTTEST
============================================================ */

.test-marker {
    position: absolute;

    top: 2px;
    right: 56px;

    color: var(--test);

    font-size: 12px;
    font-weight: 700;

    line-height: 1;
}


/* ============================================================
   ICON
============================================================ */

.icon-box {
    width: 46px;
    height: 46px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    border:
        1px solid
        var(--line);

    border-radius: 12px;
}


.icon {
    font-size: 30px;
    line-height: 1;
}


.blue {
    color: var(--blue);
}


.orange {
    color: var(--orange);
}


/* ============================================================
   NAME
============================================================ */

.name-area {
    min-width: 0;
}


.name {
    overflow: hidden;

    color: var(--text);

    font-size: 15px;
    font-weight: 700;

    line-height: 1.1;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.subtitle {
    margin-top: 4px;

    overflow: hidden;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.05;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   STATUS
============================================================ */

.state-area {
    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: flex-start;
    justify-content: center;
}


.mode {
    color: var(--blue);

    font-size: 13px;
    font-weight: 700;

    line-height: 1.05;

    white-space: nowrap;
}


.mode.off {
    color: var(--muted);
}


.real-state {
    margin-top: 5px;

    display: flex;

    align-items: center;

    gap: 6px;

    color: var(--text);

    font-size: 13px;

    line-height: 1.05;

    white-space: nowrap;
}


.state-dot {
    width: 11px;
    height: 11px;

    flex: 0 0 auto;

    border-radius: 50%;

    background: var(--grey);
}


.state-dot.on {
    background: var(--green);
}


/* ============================================================
   POWER
============================================================ */

.power {
    color: var(--text);

    font-size: 15px;
    font-weight: 700;

    line-height: 1;

    text-align: center;

    white-space: nowrap;
}


/* ============================================================
   GEAR
============================================================ */

.gear {
    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    padding: 0;

    border:
        1px solid
        var(--line);

    border-radius: 11px;

    background: transparent;

    color: var(--text);

    font-size: 20px;

    line-height: 1;
}


/* ============================================================
   MOBILE
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
{

    .consumers {
        padding:
            54px
            8px
            8px
            8px;

        gap: 5px;
    }


    .consumer-row {
        grid-template-columns:
            48px
            minmax(0, 1fr)
            110px
            72px
            42px;

        column-gap: 6px;

        padding:
            5px
            6px;
    }


    .icon-box {
        width: 42px;
        height: 42px;
    }


    .icon {
        font-size: 28px;
    }


    .name {
        font-size: 14px;
    }


    .subtitle,
    .mode,
    .real-state {
        font-size: 12px;
    }


    .power {
        font-size: 14px;
    }


    .gear {
        width: 38px;
        height: 38px;

        font-size: 19px;
    }


    .test-marker {
        right: 50px;
        font-size: 12px;
    }

}

</style>

</head>


<body>


<div class="consumers">


    <div class="consumer-row">

        <div class="test-marker">
            TEST V2
        </div>

        <div class="icon-box">
            <div class="icon blue">♧</div>
        </div>

        <div class="name-area">
            <div class="name">
                Entfeuchter UG
            </div>
            <div class="subtitle">
                Untergeschoss
            </div>
        </div>

        <div class="state-area">
            <div class="mode" id="ug-mode">—</div>

            <div class="real-state">
                <span class="state-dot" id="ug-dot"></span>
                <span id="ug-state">—</span>
            </div>
        </div>

        <div class="power" id="ug-power">—</div>

        <button class="gear" type="button">
            ⚙
        </button>

    </div>



    <div class="consumer-row">

        <div class="test-marker">
            TEST V2
        </div>

        <div class="icon-box">
            <div class="icon blue">♧</div>
        </div>

        <div class="name-area">
            <div class="name">
                Entfeuchter OG
            </div>
            <div class="subtitle">
                Obergeschoss
            </div>
        </div>

        <div class="state-area">
            <div class="mode" id="og-mode">—</div>

            <div class="real-state">
                <span class="state-dot" id="og-dot"></span>
                <span id="og-state">—</span>
            </div>
        </div>

        <div class="power" id="og-power">—</div>

        <button class="gear" type="button">
            ⚙
        </button>

    </div>



    <div class="consumer-row">

        <div class="test-marker">
            TEST V2
        </div>

        <div class="icon-box">
            <div class="icon blue">≋</div>
        </div>

        <div class="name-area">
            <div class="name">
                Poolpumpe + Salzelektrolyse
            </div>
            <div class="subtitle">
                Pooltechnik
            </div>
        </div>

        <div class="state-area">
            <div class="mode" id="pool-mode">—</div>

            <div class="real-state">
                <span class="state-dot" id="pool-dot"></span>
                <span id="pool-state">—</span>
            </div>
        </div>

        <div class="power" id="pool-power">—</div>

        <button class="gear" type="button">
            ⚙
        </button>

    </div>



    <div class="consumer-row">

        <div class="test-marker">
            TEST V2
        </div>

        <div class="icon-box">
            <div class="icon orange">◉</div>
        </div>

        <div class="name-area">
            <div class="name">
                Boiler
            </div>
            <div class="subtitle">
                Warmwasser
            </div>
        </div>

        <div class="state-area">
            <div class="mode" id="boiler-mode">—</div>

            <div class="real-state">
                <span class="state-dot" id="boiler-dot"></span>
                <span id="boiler-state">—</span>
            </div>
        </div>

        <div class="power" id="boiler-power">—</div>

        <button class="gear" type="button">
            ⚙
        </button>

    </div>



    <div class="consumer-row">

        <div class="test-marker">
            TEST V2
        </div>

        <div class="icon-box">
            <div class="icon orange">▥</div>
        </div>

        <div class="name-area">
            <div class="name">
                Heizstab / Puffer
            </div>
            <div class="subtitle">
                Heizung
            </div>
        </div>

        <div class="state-area">
            <div class="mode" id="heater-mode">—</div>

            <div class="real-state">
                <span class="state-dot" id="heater-dot"></span>
                <span id="heater-state">—</span>
            </div>
        </div>

        <div class="power" id="heater-power">—</div>

        <button class="gear" type="button">
            ⚙
        </button>

    </div>


</div>


<script>

function setText(
    id,
    value
) {
    const element =
        document.getElementById(id);

    if (!element) {
        return;
    }

    element.textContent =
        value;
}


function modeText(
    value
) {
    const mode =
        Number(value);

    if (mode === 1) {
        return "Automatik";
    }

    if (mode === 2) {
        return "Erzwungen Ein";
    }

    return "Aus";
}


function powerText(
    value
) {
    if (
        value === null ||
        value === undefined ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return "—";
    }

    const number =
        Number(value);

    if (
        Math.abs(number) < 1
    ) {
        return (
            Math.round(
                number * 1000
            ) +
            " W"
        );
    }

    return (
        number.toFixed(1) +
        " kW"
    );
}


function updateConsumer(
    key,
    data
) {
    if (!data) {
        return;
    }

    const mode =
        Number(
            data.mode
        );

    const active =
        Boolean(
            data.active
        );

    setText(
        key + "-mode",
        modeText(mode)
    );

    setText(
        key + "-state",
        active
            ? "Gerät Ein"
            : "Gerät Aus"
    );

    setText(
        key + "-power",
        powerText(
            data.power
        )
    );

    const modeElement =
        document.getElementById(
            key + "-mode"
        );

    if (modeElement) {
        modeElement.classList.toggle(
            "off",
            mode === 0
        );
    }

    const dot =
        document.getElementById(
            key + "-dot"
        );

    if (dot) {
        dot.classList.toggle(
            "on",
            active
        );
    }
}


function handleMessage(data) {

    if (!data) {
        return;
    }


    if (
        typeof data ===
        "string"
    ) {

        try {
            data =
                JSON.parse(data);

        } catch (error) {
            return;
        }

    }


    updateConsumer(
        "ug",
        data.ug
    );

    updateConsumer(
        "og",
        data.og
    );

    updateConsumer(
        "pool",
        data.pool
    );

    updateConsumer(
        "boiler",
        data.boiler
    );

    updateConsumer(
        "heater",
        data.heater
    );
}


window.addEventListener(
    "load",
    function () {

        if (
            typeof requestAction ===
            "function"
        ) {
            requestAction(
                "Refresh",
                true
            );
        }

    }
);

</script>

</body>

</html>
