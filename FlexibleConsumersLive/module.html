<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<style>

* {
    box-sizing: border-box;
}


/* ============================================================
   THEME
============================================================ */

:root {
    color-scheme: light dark;

    --text: #20262b;
    --muted: #7d878d;

    --line:
        rgba(0, 0, 0, 0.14);

    --row-bg:
        rgba(0, 0, 0, 0.015);

    --blue: #2196f3;
    --orange: #f4a321;
    --green: #19c989;
    --grey: #9ca7af;
}


@media (prefers-color-scheme: dark) {

    :root {
        --text: #f1f4f6;
        --muted: #a7afb5;

        --line:
            rgba(255, 255, 255, 0.15);

        --row-bg:
            rgba(255, 255, 255, 0.018);

        --blue: #38a9ff;
        --orange: #ffad2f;
        --green: #1bd491;
        --grey: #9ca7af;
    }

}


/* ============================================================
   BASIS
============================================================ */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* ============================================================
   GESAMTKACHEL
============================================================ */

.consumers {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows:
        repeat(
            5,
            minmax(0, 1fr)
        );

    gap: 4px;

    overflow: hidden;

    /*
     * Desktop:
     * genügend Abstand zum Symcon-Kacheltitel
     */
    padding:
        44px
        8px
        8px
        8px;
}


/* ============================================================
   ZEILE
============================================================ */

.consumer-row {
    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-columns:
        42px
        minmax(0, 1.55fr)
        minmax(100px, 1fr)
        66px
        38px;

    column-gap: 6px;

    align-items: center;

    padding:
        3px
        5px;

    border:
        1px solid
        var(--line);

    border-radius:
        11px;

    background:
        var(--row-bg);

    overflow: hidden;
}


/* ============================================================
   ICON
============================================================ */

.icon-box {
    width: 36px;
    height: 36px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    border:
        1px solid
        var(--line);

    border-radius:
        9px;
}


.icon {
    font-size: 24px;
    line-height: 1;
}


.blue {
    color: var(--blue);
}


.orange {
    color: var(--orange);
}


/* ============================================================
   NAME
============================================================ */

.name-area {
    min-width: 0;
}


.name {
    overflow: hidden;

    color: var(--text);

    font-size: 13px;
    font-weight: 700;

    line-height: 1.05;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.subtitle {
    margin-top: 2px;

    overflow: hidden;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.05;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   STATUS
============================================================ */

.state-area {
    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: flex-start;
    justify-content: center;
}


.mode {
    max-width: 100%;

    overflow: hidden;

    color: var(--blue);

    font-size: 13px;
    font-weight: 650;

    line-height: 1.05;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.mode.off {
    color: var(--muted);
}


.real-state {
    margin-top: 3px;

    display: flex;

    align-items: center;

    gap: 5px;

    max-width: 100%;

    overflow: hidden;

    color: var(--text);

    font-size: 13px;

    line-height: 1.05;

    white-space: nowrap;
}


.state-dot {
    flex:
        0 0 auto;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: var(--grey);
}


.state-dot.on {
    background: var(--green);
}


/* ============================================================
   LEISTUNG
============================================================ */

.power {
    overflow: hidden;

    color: var(--text);

    font-size: 13px;
    font-weight: 700;

    line-height: 1;

    text-align: right;

    white-space: nowrap;
}


/* ============================================================
   ZAHNRAD
============================================================ */

.gear {
    width: 34px;
    height: 34px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    padding: 0;

    border:
        1px solid
        var(--line);

    border-radius:
        9px;

    background: transparent;

    color: var(--text);

    font-size: 18px;

    line-height: 1;
}


/* ============================================================
   MOBILE

   Kleinste Schrift 12px.
   Alle 5 Zeilen müssen passen.
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
{

    .consumers {
        /*
         * Mobile Titelzone etwas höher.
         */
        padding:
            50px
            8px
            8px
            8px;

        gap: 5px;
    }


    .consumer-row {
        grid-template-columns:
            46px
            minmax(0, 1.5fr)
            minmax(96px, 1fr)
            67px
            40px;

        column-gap: 5px;

        padding:
            4px
            5px;

        border-radius:
            12px;
    }


    .icon-box {
        width: 40px;
        height: 40px;

        border-radius: 10px;
    }


    .icon {
        font-size: 28px;
    }


    .name {
        font-size: 14px;
    }


    .subtitle {
        font-size: 12px;
    }


    .mode {
        font-size: 12px;
    }


    .real-state {
        font-size: 12px;
    }


    .state-dot {
        width: 11px;
        height: 11px;
    }


    .power {
        font-size: 14px;
    }


    .gear {
        width: 37px;
        height: 37px;

        font-size: 19px;
    }

}


/* ============================================================
   SEHR SCHMALES MOBILE
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
    and
    (max-width: 430px)
{

    .consumers {
        padding:
            48px
            5px
            6px
            5px;

        gap: 4px;
    }


    .consumer-row {
        grid-template-columns:
            42px
            minmax(0, 1.45fr)
            minmax(87px, 1fr)
            58px
            36px;

        column-gap: 4px;

        padding:
            3px
            4px;
    }


    .icon-box {
        width: 37px;
        height: 37px;
    }


    .icon {
        font-size: 25px;
    }


    .name {
        font-size: 13px;
    }


    .subtitle,
    .mode,
    .real-state {
        font-size: 12px;
    }


    .power {
        font-size: 13px;
    }


    .gear {
        width: 33px;
        height: 33px;

        font-size: 17px;
    }

}

</style>

</head>


<body>


<div class="consumers">


    <!-- UG -->

    <div class="consumer-row">

        <div class="icon-box">
            <div class="icon blue">♧</div>
        </div>

        <div class="name-area">

            <div class="name">
                Entfeuchter UG
            </div>

            <div class="subtitle">
                Untergeschoss
            </div>

        </div>

        <div class="state-area">

            <div
                class="mode"
                id="ug-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="ug-dot"
                ></span>

                <span id="ug-state">
                    —
                </span>

            </div>

        </div>

        <div
            class="power"
            id="ug-power"
        >
            —
        </div>

        <button
            type="button"
            class="gear"
        >
            ⚙
        </button>

    </div>



    <!-- OG -->

    <div class="consumer-row">

        <div class="icon-box">
            <div class="icon blue">♧</div>
        </div>

        <div class="name-area">

            <div class="name">
                Entfeuchter OG
            </div>

            <div class="subtitle">
                Obergeschoss
            </div>

        </div>

        <div class="state-area">

            <div
                class="mode"
                id="og-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="og-dot"
                ></span>

                <span id="og-state">
                    —
                </span>

            </div>

        </div>

        <div
            class="power"
            id="og-power"
        >
            —
        </div>

        <button
            type="button"
            class="gear"
        >
            ⚙
        </button>

    </div>



    <!-- POOL -->

    <div class="consumer-row">

        <div class="icon-box">
            <div class="icon blue">≋</div>
        </div>

        <div class="name-area">

            <div class="name">
                Poolpumpe + Salzelektrolyse
            </div>

            <div class="subtitle">
                Pooltechnik
            </div>

        </div>

        <div class="state-area">

            <div
                class="mode"
                id="pool-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="pool-dot"
                ></span>

                <span id="pool-state">
                    —
                </span>

            </div>

        </div>

        <div
            class="power"
            id="pool-power"
        >
            —
        </div>

        <button
            type="button"
            class="gear"
        >
            ⚙
        </button>

    </div>



    <!-- BOILER -->

    <div class="consumer-row">

        <div class="icon-box">
            <div class="icon orange">◉</div>
        </div>

        <div class="name-area">

            <div class="name">
                Boiler
            </div>

            <div class="subtitle">
                Warmwasser
            </div>

        </div>

        <div class="state-area">

            <div
                class="mode"
                id="boiler-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="boiler-dot"
                ></span>

                <span id="boiler-state">
                    —
                </span>

            </div>

        </div>

        <div
            class="power"
            id="boiler-power"
        >
            —
        </div>

        <button
            type="button"
            class="gear"
        >
            ⚙
        </button>

    </div>



    <!-- HEIZSTAB -->

    <div class="consumer-row">

        <div class="icon-box">
            <div class="icon orange">▥</div>
        </div>

        <div class="name-area">

            <div class="name">
                Heizstab / Puffer
            </div>

            <div class="subtitle">
                Heizung
            </div>

        </div>

        <div class="state-area">

            <div
                class="mode"
                id="heater-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="heater-dot"
                ></span>

                <span id="heater-state">
                    —
                </span>

            </div>

        </div>

        <div
            class="power"
            id="heater-power"
        >
            —
        </div>

        <button
            type="button"
            class="gear"
        >
            ⚙
        </button>

    </div>


</div>



<script>

/* ============================================================
   HELPERS
============================================================ */

function setText(
    id,
    value
) {

    const element =
        document.getElementById(
            id
        );


    if (!element) {
        return;
    }


    element.textContent =
        value;
}


function modeText(
    value
) {

    const mode =
        Number(
            value
        );


    if (mode === 1) {
        return "Automatik";
    }


    if (mode === 2) {
        return "Erzwungen Ein";
    }


    return "Aus";
}


function powerText(
    value
) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return "—";
    }


    const number =
        Number(
            value
        );


    if (
        Math.abs(
            number
        ) < 1
    ) {

        return (
            Math.round(
                number * 1000
            ) +
            " W"
        );
    }


    return (
        number.toFixed(1) +
        " kW"
    );
}


/* ============================================================
   EINEN VERBRAUCHER
============================================================ */

function updateConsumer(
    key,
    data
) {

    if (!data) {
        return;
    }


    const mode =
        Number(
            data.mode
        );


    const active =
        Boolean(
            data.active
        );


    setText(
        key + "-mode",
        modeText(
            mode
        )
    );


    setText(
        key + "-state",
        active
            ? "Gerät Ein"
            : "Gerät Aus"
    );


    setText(
        key + "-power",
        powerText(
            data.power
        )
    );


    const modeElement =
        document.getElementById(
            key + "-mode"
        );


    if (modeElement) {

        modeElement.classList.toggle(
            "off",
            mode === 0
        );

    }


    const dot =
        document.getElementById(
            key + "-dot"
        );


    if (dot) {

        dot.classList.toggle(
            "on",
            active
        );

    }

}


/* ============================================================
   LIVE MESSAGE
============================================================ */

function handleMessage(
    data
) {

    if (!data) {
        return;
    }


    if (
        typeof data ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }

    }


    updateConsumer(
        "ug",
        data.ug
    );


    updateConsumer(
        "og",
        data.og
    );


    updateConsumer(
        "pool",
        data.pool
    );


    updateConsumer(
        "boiler",
        data.boiler
    );


    updateConsumer(
        "heater",
        data.heater
    );

}


/* ============================================================
   INITIAL
============================================================ */

window.addEventListener(
    "load",
    function () {

        /*
         * Startanforderung an Modul.
         */

        if (
            typeof requestAction ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );

        }

    }
);

</script>


</body>

</html>
