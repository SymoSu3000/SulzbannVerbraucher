<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<style>

/* ============================================================
   BASIS / THEME
============================================================ */

* {
    box-sizing: border-box;
}


:root {
    color-scheme: light dark;

    --text: #20262b;
    --muted: #7c878d;

    --border:
        rgba(0, 0, 0, 0.13);

    --card:
        rgba(0, 0, 0, 0.025);

    --card-hover:
        rgba(0, 0, 0, 0.045);

    --blue: #2196f3;
    --orange: #f5a623;
    --green: #16c784;
    --grey: #98a4ad;

    --button-bg:
        rgba(0, 0, 0, 0.025);

    --button-border:
        rgba(0, 0, 0, 0.14);
}


@media (prefers-color-scheme: dark) {

    :root {
        --text: #f0f3f5;
        --muted: #a5adb3;

        --border:
            rgba(255, 255, 255, 0.14);

        --card:
            rgba(255, 255, 255, 0.025);

        --card-hover:
            rgba(255, 255, 255, 0.05);

        --blue: #38a9ff;
        --orange: #ffad2f;
        --green: #19d58d;
        --grey: #98a4ad;

        --button-bg:
            rgba(255, 255, 255, 0.025);

        --button-border:
            rgba(255, 255, 255, 0.14);
    }

}


html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* ============================================================
   HAUPTBEREICH

   Oben Abstand für Symcon-Kacheltitel.
============================================================ */

.consumers {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows:
        repeat(5, minmax(0, 1fr));

    gap: 5px;

    padding:
        38px
        9px
        9px
        9px;

    overflow: hidden;
}


/* ============================================================
   VERBRAUCHERZEILE
============================================================ */

.consumer {
    min-height: 0;

    display: grid;

    /*
     * Symbol | Name | Modus/Status | Leistung | Zahnrad
     */
    grid-template-columns:
        52px
        minmax(0, 1.65fr)
        minmax(112px, 1.15fr)
        78px
        46px;

    align-items: center;

    column-gap: 8px;

    padding:
        5px
        7px;

    border:
        1px solid
        var(--border);

    border-radius:
        13px;

    background:
        var(--card);
}


/* ============================================================
   SYMBOL
============================================================ */

.icon-box {
    width: 44px;
    height: 44px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    border:
        1px solid
        var(--border);

    border-radius: 11px;

    background:
        transparent;
}


.icon {
    width: 32px;
    height: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 28px;

    line-height: 1;
}


.icon.blue {
    color: var(--blue);
}


.icon.orange {
    color: var(--orange);
}


/* ============================================================
   NAME / BEREICH

   Desktop kleinste Schrift = 13 px
============================================================ */

.name-column {
    min-width: 0;
}


.name {
    overflow: hidden;

    color: var(--text);

    font-size: 14px;
    font-weight: 700;

    line-height: 1.15;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.subtitle {
    margin-top: 3px;

    overflow: hidden;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.1;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   MODUS / GERÄTESTATUS
============================================================ */

.state-column {
    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: flex-start;
}


.mode {
    overflow: hidden;

    color: var(--blue);

    font-size: 13px;
    font-weight: 650;

    line-height: 1.1;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.mode.off {
    color: var(--muted);
}


.real-state {
    margin-top: 4px;

    display: flex;

    align-items: center;

    gap: 6px;

    min-width: 0;

    color: var(--text);

    font-size: 13px;

    line-height: 1.1;

    white-space: nowrap;
}


.state-dot {
    flex: 0 0 auto;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: var(--grey);
}


.state-dot.on {
    background: var(--green);

    box-shadow:
        0 0 5px
        rgba(22, 199, 132, 0.35);
}


/* ============================================================
   LEISTUNG
============================================================ */

.power {
    color: var(--text);

    font-size: 14px;
    font-weight: 700;

    line-height: 1;

    text-align: right;

    white-space: nowrap;
}


/* ============================================================
   EINSTELLUNGEN
============================================================ */

.settings-button {
    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    padding: 0;

    border:
        1px solid
        var(--button-border);

    border-radius: 11px;

    background:
        var(--button-bg);

    color: var(--text);

    font: inherit;

    font-size: 21px;

    cursor: pointer;
}


.settings-button:active {
    transform:
        scale(0.96);
}


/* ============================================================
   DESKTOP / LAPTOP

   Auch eine 500px breite Kachel auf einem Laptop bleibt
   Desktop. Keine "Tablet"-Umschaltung anhand der Breite.
============================================================ */

@media
    (hover: hover)
    and
    (pointer: fine)
{

    .subtitle,
    .mode,
    .real-state {
        /*
         * Schriftgrössen-Test Zeile 06
         */
        font-size: 13px;
    }

}


/* ============================================================
   KLEINERE DESKTOP-KACHELHÖHE

   Noch kompakter, aber NIEMALS kleiner als 13 px.
============================================================ */

@media
    (hover: hover)
    and
    (pointer: fine)
    and
    (max-height: 330px)
{

    .consumers {
        gap: 4px;

        padding:
            35px
            7px
            7px
            7px;
    }


    .consumer {
        grid-template-columns:
            46px
            minmax(0, 1.65fr)
            minmax(108px, 1.15fr)
            72px
            42px;

        column-gap: 6px;

        padding:
            3px
            5px;

        border-radius: 11px;
    }


    .icon-box {
        width: 39px;
        height: 39px;

        border-radius: 10px;
    }


    .icon {
        width: 29px;
        height: 29px;

        font-size: 25px;
    }


    .name {
        font-size: 13px;
    }


    .subtitle {
        margin-top: 2px;

        font-size: 13px;
    }


    .mode {
        font-size: 13px;
    }


    .real-state {
        margin-top: 3px;

        font-size: 13px;
    }


    .state-dot {
        width: 10px;
        height: 10px;
    }


    .power {
        font-size: 13px;
    }


    .settings-button {
        width: 38px;
        height: 38px;

        border-radius: 10px;

        font-size: 19px;
    }

}


/* ============================================================
   GROSSE DESKTOP-ANSICHT
============================================================ */

@media
    (hover: hover)
    and
    (pointer: fine)
    and
    (min-height: 560px)
{

    .consumers {
        gap: 9px;

        padding:
            48px
            18px
            18px
            18px;
    }


    .consumer {
        grid-template-columns:
            68px
            minmax(0, 1.75fr)
            minmax(150px, 1.15fr)
            115px
            62px;

        column-gap: 16px;

        padding:
            10px
            14px;

        border-radius: 16px;
    }


    .icon-box {
        width: 58px;
        height: 58px;

        border-radius: 14px;
    }


    .icon {
        width: 43px;
        height: 43px;

        font-size: 38px;
    }


    .name {
        font-size: 18px;
    }


    .subtitle {
        margin-top: 5px;

        font-size: 14px;
    }


    .mode {
        font-size: 15px;
    }


    .real-state {
        margin-top: 5px;

        font-size: 14px;
    }


    .state-dot {
        width: 13px;
        height: 13px;
    }


    .power {
        font-size: 18px;
    }


    .settings-button {
        width: 52px;
        height: 52px;

        border-radius: 13px;

        font-size: 25px;
    }

}


/* ============================================================
   MOBILE

   Erkennung über Touch/Coarse Pointer.
   Kleinste Schrift = 12 px.
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
{

    .consumers {
        gap: 5px;

        /*
         * Symcon Mobile benötigt oben mehr Abstand
         * zum Kacheltitel.
         */
        padding:
            44px
            9px
            9px
            9px;
    }


    .consumer {
        grid-template-columns:
            54px
            minmax(0, 1.55fr)
            minmax(112px, 1.05fr)
            76px
            48px;

        column-gap: 7px;

        padding:
            5px
            7px;

        border-radius: 13px;
    }


    /*
     * Symbole auf Mobile etwas grösser.
     */

    .icon-box {
        width: 48px;
        height: 48px;

        border-radius: 12px;
    }


    .icon {
        width: 36px;
        height: 36px;

        font-size: 31px;
    }


    /*
     * Mobile Mindestschrift = 12 px.
     */

    .name {
        font-size: 14px;
    }


    .subtitle {
        margin-top: 3px;

        font-size: 12px;
    }


    .mode {
        font-size: 12px;
    }


    .real-state {
        margin-top: 4px;

        font-size: 12px;
    }


    .state-dot {
        width: 12px;
        height: 12px;
    }


    .power {
        font-size: 14px;
    }


    .settings-button {
        width: 44px;
        height: 44px;

        font-size: 21px;
    }

}


/* ============================================================
   MOBILE SCHMAL

   Weiterhin keine Schrift unter 12 px.
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
    and
    (max-width: 430px)
{

    .consumers {
        padding:
            42px
            6px
            7px
            6px;
    }


    .consumer {
        grid-template-columns:
            47px
            minmax(0, 1.45fr)
            minmax(96px, 1fr)
            62px
            42px;

        column-gap: 5px;

        padding:
            4px
            5px;
    }


    .icon-box {
        width: 42px;
        height: 42px;
    }


    .icon {
        width: 32px;

    }


    .name {

    }


    .subtitle,
    .mode,
    .real-state {
        font-size: 12px;
    }


    .power {
        font-size: 13px;
    }


    .settings-button {
        width: 39px;
        height: 39px;

        font-size: 19px;
    }

}

</style>

</head>


<body>

<script>

/* ============================================================
   HELPER
============================================================ */

function setText(
    id,
    value
) {

    const element =
        document.getElementById(id);


    if (!element) {
        return;
    }


    element.textContent =
        value ?? "—";
}



function formatPower(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(
            Number(value)
        )
    ) {

        return "—";
    }


    const number =
        Number(value);


    /*
     * Bereits kW?
     *
     * Bei unseren Verbrauchern sind z.B.
     * Boiler/Puffer 6 kW und Entfeuchter/Pool 0.5 kW.
     */

    if (
        Math.abs(number) >= 1
    ) {

        return (
            number.toFixed(1) +
            " kW"
        );
    }


    return (
        Math.round(
            number * 1000
        ) +
        " W"
    );
}



/* ============================================================
   MODUS
============================================================ */

function modeText(
    value
) {

    /*
     * EMS:
     *
     * 0 = Aus
     * 1 = Automatik
     * 2 = Erzwungen Ein
     */

    const mode =
        Number(value);


    if (mode === 1) {
        return "Automatik";
    }


    if (mode === 2) {
        return "Erzwungen Ein";
    }


    return "Aus";
}



/* ============================================================
   EINEN VERBRAUCHER AKTUALISIEREN
============================================================ */

function updateConsumer(
    key,
    consumer
) {

    if (!consumer) {
        return;
    }


    const mode =
        consumer.mode;


    const active =
        Boolean(
            consumer.active ??
            consumer.status ??
            consumer.on ??
            false
        );


    /*
     * Modus
     */

    setText(
        key + "-mode",
        modeText(
            mode
        )
    );


    const modeElement =
        document.getElementById(
            key + "-mode"
        );


    if (modeElement) {

        modeElement.classList.toggle(
            "off",
            Number(mode) === 0
        );

    }


    /*
     * Gerätestatus
     */

    setText(
        key + "-state",
        active
            ? "Gerät Ein"
            : "Gerät Aus"
    );


    const dot =
        document.getElementById(
            key + "-dot"
        );


    if (dot) {

        dot.classList.toggle(
            "on",
            active
        );

    }


    /*
     * Leistung
     */

    setText(
        key + "-power",
        formatPower(
            consumer.power
        )
    );

}



/* ============================================================
   PAYLOAD NORMALISIEREN

   Unterstützt verschiedene Payloadformen, damit wir die
   bestehende Modul-PHP-Logik nicht unnötig anfassen müssen.
============================================================ */

function getConsumer(
    data,
    key,
    aliases = []
) {

    /*
     * Form:
     *
     * {
     *   consumers: {
     *      ug: {...}
     *   }
     * }
     */

    if (
        data.consumers &&
        typeof data.consumers === "object" &&
        !Array.isArray(
            data.consumers
        )
    ) {

        if (data.consumers[key]) {
            return data.consumers[key];
        }


        for (
            const alias of aliases
        ) {

            if (
                data.consumers[alias]
            ) {
                return data.consumers[alias];
            }

        }

    }


    /*
     * Form:
     *
     * {
     *    ug: {...}
     * }
     */

    if (
        data[key] &&
        typeof data[key] === "object"
    ) {

        return data[key];
    }


    for (
        const alias of aliases
    ) {

        if (
            data[alias] &&
            typeof data[alias] === "object"
        ) {

            return data[alias];
        }

    }


    /*
     * Array:
     *
     * consumers: [
     *   { key: "ug", ... }
     * ]
     */

    const list =
        Array.isArray(
            data
        )
            ? data
            : (
                Array.isArray(
                    data.consumers
                )
                    ? data.consumers
                    : null
            );


    if (list) {

        const names =
            [
                key,
                ...aliases
            ];


        return list.find(
            function (item) {

                if (!item) {
                    return false;
                }


                const itemKey =
                    String(
                        item.key ??
                        item.id ??
                        item.ident ??
                        ""
                    ).toLowerCase();


                return names.some(
                    function (name) {

                        return (
                            itemKey ===
                            String(name)
                                .toLowerCase()
                        );

                    }
                );

            }
        ) || null;

    }


    return null;
}



/* ============================================================
   LIVE MESSAGE
============================================================ */

function handleMessage(
    data
) {

    if (
        typeof data ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }

    }


    if (
        !data ||
        typeof data !==
        "object"
    ) {

        return;
    }


    updateConsumer(
        "ug",
        getConsumer(
            data,
            "ug",
            [
                "entfeuchterUG",
                "dehumidifierUG"
            ]
        )
    );


    updateConsumer(
        "og",
        getConsumer(
            data,
            "og",
            [
                "entfeuchterOG",
                "dehumidifierOG"
            ]
        )
    );


    updateConsumer(
        "pool",
        getConsumer(
            data,
            "pool",
            [
                "poolpumpe",
                "poolPump"
            ]
        )
    );


    updateConsumer(
        "boiler",
        getConsumer(
            data,
            "boiler",
            [
                "warmwater",
                "dhw"
            ]
        )
    );


    updateConsumer(
        "heater",
        getConsumer(
            data,
            "heater",
            [
                "puffer",
                "buffer",
                "heizstab"
            ]
        )
    );

}



/* ============================================================
   EINSTELLUNGSBUTTONS

   Bestehende RequestAction-Schnittstelle nutzen.
============================================================ */

document
    .querySelectorAll(
        ".settings-button"
    )
    .forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    const consumer =
                        button.dataset.consumer;


                    if (
                        typeof requestAction ===
                        "function"
                    ) {

                        requestAction(
                            "OpenConfig",
                            consumer
                        );

                    }

                }
            );

        }
    );



/* ============================================================
   INITIAL
============================================================ */

window.addEventListener(
    "load",
    function () {

        if (
            typeof requestAction ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );

        }

    }
);

</script>
