<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<style>

* {
    box-sizing: border-box;
}


/* ============================================================
   THEME
============================================================ */

:root {
    color-scheme: light dark;

    --text: #20262b;
    --muted: #7c878d;

    --line:
        rgba(
            0,
            0,
            0,
            0.14
        );

    --row:
        rgba(
            0,
            0,
            0,
            0.015
        );

    --blue: #2196f3;
    --orange: #f5a623;
    --green: #19c98a;
    --grey: #9ca7af;
}


@media (prefers-color-scheme: dark) {

    :root {
        --text: #f1f4f6;
        --muted: #a6adb3;

        --line:
            rgba(
                255,
                255,
                255,
                0.15
            );

        --row:
            rgba(
                255,
                255,
                255,
                0.018
            );

        --blue: #38a9ff;
        --orange: #ffad2f;
        --green: #1bd491;
        --grey: #9ca7af;
    }

}


/* ============================================================
   BASIS
============================================================ */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* ============================================================
   GESAMTKACHEL

   Oben bewusst genügend Platz für den Symcon-Titel.
============================================================ */

.consumers {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows:
        repeat(
            5,
            minmax(
                0,
                1fr
            )
        );

    gap: 4px;

    padding:
        48px
        8px
        8px
        8px;

    overflow: hidden;
}


/* ============================================================
   ZEILE
============================================================ */

.consumer-row {
    min-width: 0;
    min-height: 0;

    display: grid;

    /*
     * Symbol
     * Name
     * Modus / Status
     * Leistung
     * Zahnrad
     */

    grid-template-columns:
        44px
        minmax(0, 1.65fr)
        minmax(104px, 1fr)
        70px
        40px;

    column-gap: 6px;

    align-items: center;

    padding:
        3px
        5px;

    border:
        1px solid
        var(--line);

    border-radius:
        11px;

    background:
        var(--row);

    overflow: hidden;
}


/* ============================================================
   ICON
============================================================ */

.icon-box {
    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    border:
        1px solid
        var(--line);

    border-radius:
        10px;
}


.icon {
    font-size: 25px;

    line-height: 1;
}


.blue {
    color: var(--blue);
}


.orange {
    color: var(--orange);
}


/* ============================================================
   NAME

   Desktop:
   kleinste Schrift = 13 px
============================================================ */

.name-area {
    min-width: 0;
}


.name {
    overflow: hidden;

    color: var(--text);

    font-size: 13px;
    font-weight: 700;

    line-height: 1.08;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.subtitle {
    margin-top: 2px;

    overflow: hidden;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.05;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   MODUS / STATUS
============================================================ */

.state-area {
    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: flex-start;
}


.mode {
    max-width: 100%;

    overflow: hidden;

    color: var(--blue);

    font-size: 13px;
    font-weight: 650;

    line-height: 1.05;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.mode.off {
    color: var(--muted);
}


.real-state {
    margin-top: 3px;

    max-width: 100%;

    display: flex;

    align-items: center;

    gap: 5px;

    overflow: hidden;

    color: var(--text);

    font-size: 13px;

    line-height: 1.05;

    white-space: nowrap;
}


.state-dot {
    width: 10px;
    height: 10px;

    flex:
        0 0 auto;

    border-radius: 50%;

    background:
        var(--grey);
}


.state-dot.on {
    background:
        var(--green);
}


/* ============================================================
   LEISTUNG
============================================================ */

.power {
    color: var(--text);

    font-size: 13px;
    font-weight: 700;

    line-height: 1;

    text-align: right;

    white-space: nowrap;
}


/* ============================================================
   ZAHNRAD
============================================================ */

.gear {
    width: 36px;
    height: 36px;

    display: flex;

    align-items: center;
    justify-content: center;

    justify-self: center;

    padding: 0;

    border:
        1px solid
        var(--line);

    border-radius:
        10px;

    background:
        transparent;

    color: var(--text);

    font-size: 19px;

    line-height: 1;
}


/* ============================================================
   MOBILE

   Keine Breiten-Erkennung für Laptop/Tablet.
   Mobile nur über Touch / coarse pointer.

   Kleinste Schrift:
   12 px
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
{

    .consumers {
        /*
         * Titelzone Mobile etwas höher.
         */
        padding:
            52px
            8px
            8px
            8px;

        gap: 5px;
    }


    .consumer-row {
        grid-template-columns:
            48px
            minmax(0, 1.55fr)
            minmax(104px, 1fr)
            72px
            42px;

        column-gap: 6px;

        padding:
            4px
            6px;

        border-radius:
            12px;
    }


    .icon-box {
        width: 42px;
        height: 42px;
    }


    .icon {
        font-size: 29px;
    }


    .name {
        font-size: 14px;
    }


    .subtitle {
        font-size: 12px;
    }


    .mode {
        font-size: 12px;
    }


    .real-state {
        font-size: 12px;
    }


    .state-dot {
        width: 11px;
        height: 11px;
    }


    .power {
        font-size: 14px;
    }


    .gear {
        width: 39px;
        height: 39px;

        font-size: 20px;
    }

}


/* ============================================================
   SEHR SCHMALES MOBILE

   Auch hier:
   keine Schrift kleiner als 12 px.
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
    and
    (max-width: 430px)
{

    .consumers {
        padding:
            50px
            5px
            6px
            5px;

        gap: 4px;
    }


    .consumer-row {
        grid-template-columns:
            43px
            minmax(0, 1.5fr)
            minmax(90px, 1fr)
            60px
            38px;

        column-gap: 4px;

        padding:
            3px
            4px;
    }


    .icon-box {
        width: 38px;
        height: 38px;
    }


    .icon {
        font-size: 26px;
    }


    .name {
        font-size: 13px;
    }


    .subtitle,
    .mode,
    .real-state {
        font-size: 12px;
    }


    .power {
        font-size: 13px;
    }


    .gear {
        width: 35px;
        height: 35px;

        font-size: 18px;
    }

}

</style>

</head>


<body>


<div class="consumers">


    <!-- ========================================================
         ENTFEUCHTER UG
    ========================================================= -->

    <div class="consumer-row">

        <div class="icon-box">

            <div class="icon blue">
                ♧
            </div>

        </div>


        <div class="name-area">

            <div class="name">
                Entfeuchter UG
            </div>

            <div class="subtitle">
                Untergeschoss
            </div>

        </div>


        <div class="state-area">

            <div
                class="mode"
                id="ug-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="ug-dot"
                ></span>

                <span id="ug-state">
                    —
                </span>

            </div>

        </div>


        <div
            class="power"
            id="ug-power"
        >
            —
        </div>


        <button
            class="gear"
            type="button"
        >
            ⚙
        </button>

    </div>



    <!-- ========================================================
         ENTFEUCHTER OG
    ========================================================= -->

    <div class="consumer-row">

        <div class="icon-box">

            <div class="icon blue">
                ♧
            </div>

        </div>


        <div class="name-area">

            <div class="name">
                Entfeuchter OG
            </div>

            <div class="subtitle">
                Obergeschoss
            </div>

        </div>


        <div class="state-area">

            <div
                class="mode"
                id="og-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="og-dot"
                ></span>

                <span id="og-state">
                    —
                </span>

            </div>

        </div>


        <div
            class="power"
            id="og-power"
        >
            —
        </div>


        <button
            class="gear"
            type="button"
        >
            ⚙
        </button>

    </div>



    <!-- ========================================================
         POOL
    ========================================================= -->

    <div class="consumer-row">

        <div class="icon-box">

            <div class="icon blue">
                ≋
            </div>

        </div>


        <div class="name-area">

            <div class="name">
                Poolpumpe + Salzelektrolyse
            </div>

            <div class="subtitle">
                Pooltechnik
            </div>

        </div>


        <div class="state-area">

            <div
                class="mode"
                id="pool-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="pool-dot"
                ></span>

                <span id="pool-state">
                    —
                </span>

            </div>

        </div>


        <div
            class="power"
            id="pool-power"
        >
            —
        </div>


        <button
            class="gear"
            type="button"
        >
            ⚙
        </button>

    </div>



    <!-- ========================================================
         BOILER
    ========================================================= -->

    <div class="consumer-row">

        <div class="icon-box">

            <div class="icon orange">
                ◉
            </div>

        </div>


        <div class="name-area">

            <div class="name">
                Boiler
            </div>

            <div class="subtitle">
                Warmwasser
            </div>

        </div>


        <div class="state-area">

            <div
                class="mode"
                id="boiler-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="boiler-dot"
                ></span>

                <span id="boiler-state">
                    —
                </span>

            </div>

        </div>


        <div
            class="power"
            id="boiler-power"
        >
            —
        </div>


        <button
            class="gear"
            type="button"
        >
            ⚙
        </button>

    </div>



    <!-- ========================================================
         HEIZSTAB / PUFFER
    ========================================================= -->

    <div class="consumer-row">

        <div class="icon-box">

            <div class="icon orange">
                ▥
            </div>

        </div>


        <div class="name-area">

            <div class="name">
                Heizstab / Puffer
            </div>

            <div class="subtitle">
                Heizung
            </div>

        </div>


        <div class="state-area">

            <div
                class="mode"
                id="heater-mode"
            >
                —
            </div>

            <div class="real-state">

                <span
                    class="state-dot"
                    id="heater-dot"
                ></span>

                <span id="heater-state">
                    —
                </span>

            </div>

        </div>


        <div
            class="power"
            id="heater-power"
        >
            —
        </div>


        <button
            class="gear"
            type="button"
        >
            ⚙
        </button>

    </div>


</div>



<script>


/* ============================================================
   HELPER
============================================================ */

function setText(
    id,
    value
) {

    const element =
        document.getElementById(
            id
        );


    if (!element) {
        return;
    }


    element.textContent =
        value;
}



function modeText(value) {

    const mode =
        Number(
            value
        );


    if (mode === 1) {
        return "Automatik";
    }


    if (mode === 2) {
        return "Erzwungen Ein";
    }


    return "Aus";
}



function powerText(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return "—";
    }


    const number =
        Number(
            value
        );


    if (
        Math.abs(
            number
        ) < 1
    ) {

        return (
            Math.round(
                number * 1000
            ) +
            " W"
        );
    }


    return (
        number.toFixed(1) +
        " kW"
    );
}



/* ============================================================
   EINZELNE ZEILE
============================================================ */

function updateConsumer(
    key,
    data
) {

    if (!data) {
        return;
    }


    const mode =
        Number(
            data.mode ??
            0
        );


    const active =
        Boolean(
            data.active
        );


    setText(
        key + "-mode",
        modeText(
            mode
        )
    );


    setText(
        key + "-state",

        active
            ? "Gerät Ein"
            : "Gerät Aus"
    );


    setText(
        key + "-power",
        powerText(
            data.power
        )
    );


    const modeElement =
        document.getElementById(
            key + "-mode"
        );


    if (modeElement) {

        modeElement.classList.toggle(
            "off",
            mode === 0
        );

    }


    const dot =
        document.getElementById(
            key + "-dot"
        );


    if (dot) {

        dot.classList.toggle(
            "on",
            active
        );

    }

}



/* ============================================================
   LIVE UPDATE
============================================================ */

function handleMessage(data) {

    if (!data) {
        return;
    }


    if (
        typeof data ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }

    }


    updateConsumer(
        "ug",
        data.ug
    );


    updateConsumer(
        "og",
        data.og
    );


    updateConsumer(
        "pool",
        data.pool
    );


    updateConsumer(
        "boiler",
        data.boiler
    );


    updateConsumer(
        "heater",
        data.heater
    );

}



/* ============================================================
   INITIAL
============================================================ */

window.addEventListener(
    "load",
    function () {

        /*
         * Eingebauter Test:
         *
         * module.html?test=1
         *
         * Damit kann die Anzeige unabhängig von Symcon
         * mit definierten Werten geprüft werden.
         */

        const test =
            new URLSearchParams(
                location.search
            ).get(
                "test"
            );


        if (
            test === "1"
        ) {

            handleMessage({

                ug: {
                    mode: 1,
                    active: true,
                    power: 0.5
                },

                og: {
                    mode: 1,
                    active: true,
                    power: 0.5
                },

                pool: {
                    mode: 1,
                    active: false,
                    power: 0.5
                },

                boiler: {
                    mode: 1,
                    active: false,
                    power: 6
                },

                heater: {
                    mode: 0,
                    active: false,
                    power: 6
                }

            });


            return;
        }


        if (
            typeof requestAction ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );

        }

    }
);


</script>

</body>

</html>
