<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<style>

    /* ================================================================ */
    /* SYMCON THEME                                                     */
    /* ================================================================ */

    :root {

        color-scheme: light dark;

        --accent:
            var(
                --accent-color,
                #18c7c0
            );

        --text:
            var(
                --content-color,
                #f2f4f6
            );

        --background:
            var(
                --card-color,
                transparent
            );

        --green: #20d17a;
        --blue: #39a8ff;
        --orange: #f5a623;

        /*
         * Dezente neutrale Farben.
         *
         * Keine Abhängigkeit von color-mix(),
         * da wir damit in der Energiefluss-Kachel bereits
         * unterschiedliche Darstellungen gesehen haben.
         */

        --muted:
            rgba(
                170,
                176,
                183,
                .90
            );

        --border:
            rgba(
                160,
                168,
                176,
                .24
            );

        --row-background:
            rgba(
                127,
                127,
                127,
                .035
            );
    }


    * {

        box-sizing:
            border-box;
    }


    html,
    body {

        width:
            100%;

        height:
            100%;

        margin:
            0;

        padding:
            0;

        overflow:
            hidden;

        background:
            transparent;

        color:
            var(--text);

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;
    }


    button {

        font:
            inherit;
    }


    /* ================================================================ */
    /* GESAMTBEREICH                                                    */
    /*
     * Symcon zeichnet seinen eigenen Kacheltitel darüber.
     *
     * Deshalb reservieren wir oben bewusst Platz und zeichnen
     * KEINEN zweiten Titel.
     * ================================================================ */

    #app {

        width:
            100%;

        height:
            100%;

        padding:
            52px
            12px
            12px
            12px;

        overflow:
            hidden;
    }


    #consumerList {

        width:
            100%;

        height:
            100%;

        display:
            grid;

        /*
         * Exakt fünf Verbraucher.
         * Jeder erhält denselben Anteil der verfügbaren Höhe.
         */

        grid-template-rows:
            repeat(
                5,
                minmax(
                    0,
                    1fr
                )
            );

        gap:
            7px;
    }


    /* ================================================================ */
    /* VERBRAUCHERZEILE                                                 */
    /* ================================================================ */

    .consumer {

        width:
            100%;

        min-width:
            0;

        min-height:
            0;

        overflow:
            hidden;

        display:
            grid;

        grid-template-columns:

            46px
            minmax(130px, 1.55fr)
            minmax(105px, .95fr)
            minmax(72px, .58fr)
            46px;

        grid-template-areas:

            "icon info state power gear";

        align-items:
            center;

        column-gap:
            11px;

        padding:
            7px
            10px;

        border:
            1px solid
            var(--border);

        border-radius:
            11px;

        background:
            var(--row-background);
    }


    /* ================================================================ */
    /* ICON                                                             */
    /* ================================================================ */

    .icon {

        grid-area:
            icon;

        width:
            40px;

        height:
            40px;

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        flex:
            0 0 auto;

        border:
            1px solid
            var(--border);

        border-radius:
            9px;

        color:
            var(--blue);

        font-size:
            23px;

        line-height:
            1;
    }


    .consumer[data-key="boiler"] .icon {

        color:
            var(--orange);
    }


    .consumer[data-key="pool"] .icon {

        color:
            var(--blue);
    }


    .consumer[data-key="buffer"] .icon {

        color:
            var(--orange);
    }


    /* ================================================================ */
    /* NAME                                                             */
    /* ================================================================ */

    .info {

        grid-area:
            info;

        min-width:
            0;

        overflow:
            hidden;
    }


    .name {

        max-width:
            100%;

        overflow:
            hidden;

        white-space:
            nowrap;

        text-overflow:
            ellipsis;

        color:
            var(--text);

        font-size:
            15px;

        line-height:
            1.15;

        font-weight:
            700;
    }


    .sub {

        max-width:
            100%;

        margin-top:
            3px;

        overflow:
            hidden;

        white-space:
            nowrap;

        text-overflow:
            ellipsis;

        color:
            var(--muted);

        font-size:
            11px;

        line-height:
            1.15;
    }


    /* ================================================================ */
    /* STATUS                                                           */
    /* ================================================================ */

    .state {

        grid-area:
            state;

        min-width:
            0;

        overflow:
            hidden;
    }


    .state-line {

        display:
            flex;

        align-items:
            center;

        gap:
            6px;

        min-width:
            0;

        overflow:
            hidden;

        color:
            var(--text);

        font-size:
            13px;

        line-height:
            1.15;

        font-weight:
            650;
    }


    .state-dot {

        width:
            10px;

        height:
            10px;

        flex:
            0 0 10px;

        border-radius:
            50%;

        background:
            #7d8790;
    }


    .state-dot.on {

        background:
            var(--green);
    }


    .state-text {

        min-width:
            0;

        overflow:
            hidden;

        white-space:
            nowrap;

        text-overflow:
            ellipsis;
    }


    .mode {

        margin-top:
            3px;

        min-width:
            0;

        overflow:
            hidden;

        white-space:
            nowrap;

        text-overflow:
            ellipsis;

        color:
            var(--muted);

        font-size:
            11px;

        line-height:
            1.15;
    }


    /* ================================================================ */
    /* LEISTUNG                                                         */
    /* ================================================================ */

    .power {

        grid-area:
            power;

        min-width:
            0;

        overflow:
            hidden;

        white-space:
            nowrap;

        text-overflow:
            ellipsis;

        text-align:
            right;

        color:
            var(--text);

        font-size:
            15px;

        line-height:
            1;

        font-weight:
            750;
    }


    /* ================================================================ */
    /* ZAHNRAD                                                          */
    /* ================================================================ */

    .gear {

        grid-area:
            gear;

        justify-self:
            end;

        width:
            40px;

        height:
            40px;

        margin:
            0;

        padding:
            0;

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        border:
            1px solid
            var(--border);

        border-radius:
            9px;

        outline:
            none;

        background:
            rgba(
                127,
                127,
                127,
                .045
            );

        color:
            var(--text);

        font-size:
            20px;

        line-height:
            1;

        cursor:
            pointer;
    }


    .gear:hover {

        border-color:
            var(--accent);

        color:
            var(--accent);
    }


    .gear:active {

        transform:
            scale(.94);
    }


    /* ================================================================ */
    /* MITTLERE / SCHMALE KACHEL                                       */
    /*
     * Wir verstecken nichts Wichtiges.
     *
     * Die Darstellung wird lediglich kompakter.
     * ================================================================ */

    @media
    (
        max-width:
        720px
    ) {

        #app {

            padding-left:
                9px;

            padding-right:
                9px;

            padding-bottom:
                9px;
        }


        .consumer {

            grid-template-columns:

                42px
                minmax(0, 1fr)
                minmax(82px, .7fr)
                42px;

            grid-template-areas:

                "icon info power gear"
                "icon state power gear";

            row-gap:
                2px;

            column-gap:
                8px;

            padding:
                6px
                8px;
        }


        .icon {

            width:
                36px;

            height:
                36px;

            font-size:
                21px;
        }


        .name {

            font-size:
                14px;
        }


        .sub {

            font-size:
                10px;
        }


        .state-line {

            font-size:
                12px;
        }


        .mode {

            display:
                none;
        }


        .power {

            font-size:
                14px;
        }


        .gear {

            width:
                36px;

            height:
                36px;

            font-size:
                18px;
        }
    }


    /* ================================================================ */
    /* MOBILE / SEHR SCHMAL                                             */
    /* ================================================================ */

    @media
    (
        max-width:
        460px
    ) {

        #app {

            /*
             * Etwas weniger Kopfraum,
             * da der mobile Symcon-Titel kompakter ist.
             */

            padding-top:
                49px;

            padding-left:
                8px;

            padding-right:
                8px;

            padding-bottom:
                8px;
        }


        #consumerList {

            gap:
                6px;
        }


        .consumer {

            grid-template-columns:

                38px
                minmax(0, 1fr)
                64px
                38px;

            grid-template-areas:

                "icon info power gear"
                "icon state power gear";

            column-gap:
                7px;

            padding:
                6px
                7px;
        }


        .icon {

            width:
                34px;

            height:
                34px;

            border-radius:
                8px;

            font-size:
                19px;
        }


        .name {

            font-size:
                13px;
        }


        .sub {

            font-size:
                10px;
        }


        .state-line {

            font-size:
                11px;
        }


        .state-dot {

            width:
                9px;

            height:
                9px;

            flex-basis:
                9px;
        }


        .power {

            font-size:
                13px;
        }


        .gear {

            width:
                34px;

            height:
                34px;

            border-radius:
                8px;

            font-size:
                17px;
        }
    }


    /* ================================================================ */
    /* GERINGE HÖHE                                                     */
    /*
     * Für sehr flache Desktop-Kacheln reduzieren wir vertikal
     * automatisch einige sekundäre Informationen.
     * ================================================================ */

    @media
    (
        max-height:
        390px
    ) {

        #app {

            padding-top:
                45px;

            padding-bottom:
                7px;
        }


        #consumerList {

            gap:
                5px;
        }


        .consumer {

            padding-top:
                4px;

            padding-bottom:
                4px;
        }


        .sub {

            display:
                none;
        }


        .mode {

            display:
                none;
        }


        .icon {

            width:
                32px;

            height:
                32px;

            font-size:
                18px;
        }


        .gear {

            width:
                32px;

            height:
                32px;

            font-size:
                17px;
        }


        .name {

            font-size:
                13px;
        }


        .state-line {

            font-size:
                11px;
        }


        .power {

            font-size:
                13px;
        }
    }

</style>

</head>


<body>


<div id="app">

    <div
        id="consumerList"
    ></div>

</div>



<script>

'use strict';


// ============================================================================
// START
// ============================================================================

function init()
{
    try {

        requestAction(
            'Refresh',
            true
        );

    } catch (e) {

        /*
         * Nur relevant ausserhalb der Symcon Visualisierung.
         */
    }
}


// ============================================================================
// SYMCON LIVE-DATEN
// ============================================================================

function handleMessage(
    message
)
{
    let data =
        message;


    if (
        typeof data
        ===
        'string'
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (e) {

            return;
        }
    }


    if (
        !data
        ||
        data.type
        !==
        'consumers'
    ) {

        return;
    }


    renderConsumers(
        Array.isArray(
            data.items
        )
            ?
            data.items
            :
            []
    );
}


// ============================================================================
// RENDERING
// ============================================================================

function renderConsumers(
    items
)
{
    const list =
        document.getElementById(
            'consumerList'
        );


    if (
        !list
    ) {

        return;
    }


    /*
     * Es existieren exakt fünf Verbraucher.
     *
     * Wir bauen die Liste nur beim Symcon-Update neu auf.
     * Keine Timer, keine laufenden Animationen.
     */

    const html =
        [];


    for (
        const item
        of
        items
    ) {

        html.push(
            createConsumerHTML(
                item
            )
        );
    }


    list.innerHTML =
        html.join(
            ''
        );


    /*
     * Zahnrad-Ereignisse danach sauber registrieren.
     */

    const buttons =
        list.querySelectorAll(
            '.gear'
        );


    buttons.forEach(
        button =>
        {
            button.addEventListener(
                'click',
                event =>
                {
                    event.stopPropagation();


                    const id =
                        Number(
                            button.dataset.objectId
                        );


                    if (
                        !Number.isFinite(
                            id
                        )
                        ||
                        id <= 0
                    ) {

                        return;
                    }


                    try {

                        openObject(
                            id
                        );

                    } catch (e) {

                        console.log(
                            'openObject konnte nicht ausgeführt werden',
                            e
                        );
                    }
                }
            );
        }
    );
}


// ============================================================================
// EINE ZEILE
// ============================================================================

function createConsumerHTML(
    item
)
{
    const key =
        escapeHTML(
            item.key
            ||
            ''
        );


    const name =
        escapeHTML(
            item.name
            ||
            ''
        );


    const sub =
        escapeHTML(
            item.sub
            ||
            ''
        );


    const mode =
        escapeHTML(
            normaliseMode(
                item.mode
            )
        );


    const status =
        escapeHTML(
            normaliseStatus(
                item
            )
        );


    const power =
        escapeHTML(
            item.power
            ||
            '—'
        );


    const objectID =
        Number(
            item.id
        )
        ||
        0;


    return `
        <div
            class="consumer"
            data-key="${key}"
        >

            <div class="icon">
                ${getIcon(item.icon)}
            </div>


            <div class="info">

                <div
                    class="name"
                    title="${name}"
                >
                    ${name}
                </div>


                <div
                    class="sub"
                    title="${sub}"
                >
                    ${sub}
                </div>

            </div>


            <div class="state">

                <div class="state-line">

                    <span
                        class="state-dot ${item.isOn ? 'on' : ''}"
                    ></span>

                    <span
                        class="state-text"
                        title="${status}"
                    >
                        ${status}
                    </span>

                </div>


                <div
                    class="mode"
                    title="${mode}"
                >
                    ${mode}
                </div>

            </div>


            <div
                class="power"
                title="${power}"
            >
                ${power}
            </div>


            <button
                class="gear"
                type="button"
                data-object-id="${objectID}"
                aria-label="Einstellungen ${name}"
                title="Einstellungen öffnen"
            >
                ⚙
            </button>

        </div>
    `;
}


// ============================================================================
// STATUS
// ============================================================================

function normaliseStatus(
    item
)
{
    if (
        item.status
    ) {

        return String(
            item.status
        );
    }


    return item.isOn
        ?
        'Ein'
        :
        'Aus';
}


// ============================================================================
// BETRIEBSART
// ============================================================================

function normaliseMode(
    value
)
{
    if (
        value === null
        ||
        value === undefined
        ||
        value === ''
    ) {

        return '';
    }


    return String(
        value
    );
}


// ============================================================================
// ICONS
// ============================================================================

function getIcon(
    icon
)
{
    switch (
        icon
    ) {

        case 'boiler':

            return `
                <svg
                    viewBox="0 0 32 32"
                    width="26"
                    height="26"
                >
                    <rect
                        x="9"
                        y="4"
                        width="14"
                        height="24"
                        rx="4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.3"
                    />

                    <path
                        d="M16 11 C13 15 12 17 12 19 A4 4 0 0 0 20 19 C20 17 19 15 16 11Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    />
                </svg>
            `;


        case 'drop':

            return `
                <svg
                    viewBox="0 0 32 32"
                    width="27"
                    height="27"
                >
                    <path
                        d="M16 3 C11 10 7 15 7 20 A9 9 0 0 0 25 20 C25 15 21 10 16 3Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linejoin="round"
                    />
                </svg>
            `;


        case 'pool':

            return `
                <svg
                    viewBox="0 0 32 32"
                    width="28"
                    height="28"
                >
                    <path
                        d="M5 11 H11 V4 M11 8 H18 V4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                    />

                    <path
                        d="M3 17 C6 14 9 20 12 17 C15 14 18 20 21 17 C24 14 27 20 30 17"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                    />

                    <path
                        d="M3 23 C6 20 9 26 12 23 C15 20 18 26 21 23 C24 20 27 26 30 23"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                    />
                </svg>
            `;


        case 'heater':

            return `
                <svg
                    viewBox="0 0 32 32"
                    width="27"
                    height="27"
                >
                    <rect
                        x="7"
                        y="5"
                        width="18"
                        height="22"
                        rx="2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.3"
                    />

                    <path
                        d="M11 9 V23 M16 9 V23 M21 9 V23"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    />
                </svg>
            `;


        default:

            return '●';
    }
}


// ============================================================================
// HTML SICHER ESCAPEN
// ============================================================================

function escapeHTML(
    value
)
{
    return String(
        value
        ??
        ''
    )
        .replaceAll(
            '&',
            '&amp;'
        )
        .replaceAll(
            '<',
            '&lt;'
        )
        .replaceAll(
            '>',
            '&gt;'
        )
        .replaceAll(
            '"',
            '&quot;'
        )
        .replaceAll(
            "'",
            '&#039;'
        );
}


// ============================================================================
// START
// ============================================================================

document.addEventListener(
    'DOMContentLoaded',
    init
);

</script>


</body>

</html>
