<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
  box-sizing:border-box;
}

:root{
  color-scheme:light dark;

  --text:#20262b;
  --muted:#7d878d;
  --line:rgba(0,0,0,.14);
  --row-bg:rgba(0,0,0,.02);

  --blue:#2196f3;
  --orange:#f4a321;
  --green:#19c989;
  --grey:#9ca7af;
}

@media (prefers-color-scheme:dark){
  :root{
    --text:#f1f4f6;
    --muted:#a7afb5;
    --line:rgba(255,255,255,.14);
    --row-bg:rgba(255,255,255,.02);

    --blue:#38a9ff;
    --orange:#ffad2f;
    --green:#22d695;
    --grey:#a4adb6;
  }
}

html,
body{
  margin:0;
  padding:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:transparent;
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}


/* ============================================================
   GESAMTKACHEL
============================================================ */

.consumer-list{
  width:100%;
  height:100%;

  padding:
    2.7rem
    .5rem
    .5rem;

  display:grid;

  grid-template-rows:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap:.32rem;

  overflow:hidden;
}


/* ============================================================
   ZEILE
============================================================ */

.consumer-row{
  min-width:0;
  min-height:0;

  display:grid;

  /*
   * Icon
   * Name
   * Status
   * Leistung
   * Zahnrad
   */

  grid-template-columns:
    3.1rem
    minmax(0,1fr)
    7.4rem
    max-content
    2.55rem;

  align-items:center;

  column-gap:.5rem;

  padding:
    .22rem
    .38rem;

  border:
    1px solid
    var(--line);

  border-radius:.82rem;

  background:
    var(--row-bg);

  overflow:hidden;
}


/* ============================================================
   GEMEINSAME ZELLENAUSRICHTUNG
============================================================ */

.row-cell{
  min-width:0;
  min-height:0;

  height:100%;

  display:flex;

  align-items:center;
}


/* ============================================================
   ICON
============================================================ */

.icon-wrap{
  justify-content:center;
}


.icon-box{
  width:2.55rem;
  height:2.55rem;

  margin:auto;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    var(--line);

  border-radius:.72rem;
}


.icon{
  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:1.55rem;

  line-height:1;
}


.blue{
  color:var(--blue);
}


.orange{
  color:var(--orange);
}


/* ============================================================
   NAME
============================================================ */

.name-wrap{
  justify-content:flex-start;

  overflow:hidden;
}


.name-col{
  min-width:0;
  width:100%;

  display:flex;

  flex-direction:column;

  justify-content:center;
}


.name{
  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  font-size:14px;

  font-weight:700;

  line-height:1.12;
}


.sub{
  margin-top:.14rem;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  color:var(--muted);

  font-size:13px;

  line-height:1.08;
}


/* ============================================================
   STATUSBLOCK

   WICHTIG:
   - gleiche Breite für alle
   - gleiche linke Startkante
   - dadurch auch "Aus" exakt ausgerichtet
============================================================ */

.state-wrap{
  justify-content:flex-start;
}


.state-col{
  width:7.4rem;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:flex-start;
}


.mode{
  width:100%;

  font-size:13px;

  font-weight:650;

  line-height:1.06;

  color:var(--blue);

  white-space:nowrap;

  text-align:left;
}


.mode.off{
  color:var(--muted);
}


.status-line{
  width:100%;

  margin-top:.14rem;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:.34rem;

  font-size:13px;

  line-height:1.06;

  white-space:nowrap;
}


.dot{
  width:.72rem;
  height:.72rem;

  flex:0 0 auto;

  border-radius:50%;

  background:var(--grey);
}


.dot.on{
  background:var(--green);
}


/* ============================================================
   LEISTUNG
============================================================ */

.power-wrap{
  justify-content:flex-end;
}


.power{
  min-width:4rem;

  text-align:right;

  font-size:14px;

  font-weight:700;

  line-height:1;

  white-space:nowrap;
}


/* ============================================================
   ZAHNRAD
============================================================ */

.gear-wrap{
  justify-content:center;
}


.gear{
  width:2.28rem;
  height:2.28rem;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    var(--line);

  border-radius:.7rem;

  font-size:1.12rem;

  line-height:1;

  background:transparent;

  color:var(--text);
}


/* ============================================================
   DESKTOP / LAPTOP
============================================================ */

@media
  (hover:hover)
  and
  (pointer:fine)
{

  .consumer-row{
    grid-template-columns:
      3.15rem
      minmax(0,1fr)
      7.4rem
      max-content
      2.55rem;
  }


  .name,
  .sub,
  .mode,
  .status-line,
  .power{
    font-size:13px;
  }

}


/* ============================================================
   MOBILE
============================================================ */

@media
  (hover:none)
  and
  (pointer:coarse)
{

  .consumer-list{
    padding:
      2.7rem
      .42rem
      .42rem;

    gap:.28rem;
  }


  .consumer-row{
    /*
     * Statusblock bewusst etwas näher an den Namen.
     */

    grid-template-columns:
      2.9rem
      minmax(0,1fr)
      6.8rem
      max-content
      2.3rem;

    column-gap:.4rem;

    padding:
      .2rem
      .32rem;
  }


  .icon-box{
    width:2.35rem;
    height:2.35rem;
  }


  .icon{
    font-size:1.42rem;
  }


  .name{
    font-size:14px;
  }


  .sub{
    font-size:12px;
  }


  .state-col{
    width:6.8rem;
  }


  .mode,
  .status-line{
    font-size:12px;
  }


  .power{
    min-width:3.8rem;

    font-size:14px;
  }


  .gear{
    width:2.08rem;
    height:2.08rem;

    font-size:1.02rem;
  }

}


/* ============================================================
   SCHMALES MOBILE
============================================================ */

@media
  (hover:none)
  and
  (pointer:coarse)
  and
  (max-width:430px)
{

  .consumer-row{
    grid-template-columns:
      2.75rem
      minmax(0,1fr)
      6.2rem
      max-content
      2.15rem;

    column-gap:.3rem;

    padding:
      .18rem
      .28rem;
  }


  .icon-box{
    width:2.18rem;
    height:2.18rem;
  }


  .icon{
    font-size:1.34rem;
  }


  .name{
    font-size:13px;
  }


  .sub{
    font-size:12px;
  }


  .state-col{
    width:6.2rem;
  }


  .mode,
  .status-line{
    font-size:12px;
  }


  .power{
    min-width:3.45rem;

    font-size:13px;
  }


  .gear{
    width:1.98rem;
    height:1.98rem;

    font-size:.98rem;
  }

}

</style>
</head>


<body>


<div class="consumer-list">


  <!-- UG -->

  <div class="consumer-row">

    <div class="row-cell icon-wrap">
      <div class="icon-box">
        <div class="icon blue">♧</div>
      </div>
    </div>


    <div class="row-cell name-wrap">
      <div class="name-col">
        <div class="name">
          Entfeuchter UG
        </div>
        <div class="sub">
          Untergeschoss
        </div>
      </div>
    </div>


    <div class="row-cell state-wrap">
      <div class="state-col">

        <div
          class="mode"
          id="ug-mode"
        >
          —
        </div>

        <div class="status-line">

          <span
            class="dot"
            id="ug-dot"
          ></span>

          <span id="ug-state">
            —
          </span>

        </div>

      </div>
    </div>


    <div class="row-cell power-wrap">
      <div
        class="power"
        id="ug-power"
      >
        —
      </div>
    </div>


    <div class="row-cell gear-wrap">
      <div class="gear">
        ⚙
      </div>
    </div>

  </div>



  <!-- OG -->

  <div class="consumer-row">

    <div class="row-cell icon-wrap">
      <div class="icon-box">
        <div class="icon blue">♧</div>
      </div>
    </div>


    <div class="row-cell name-wrap">
      <div class="name-col">
        <div class="name">
          Entfeuchter OG
        </div>
        <div class="sub">
          Obergeschoss
        </div>
      </div>
    </div>


    <div class="row-cell state-wrap">
      <div class="state-col">

        <div
          class="mode"
          id="og-mode"
        >
          —
        </div>

        <div class="status-line">

          <span
            class="dot"
            id="og-dot"
          ></span>

          <span id="og-state">
            —
          </span>

        </div>

      </div>
    </div>


    <div class="row-cell power-wrap">
      <div
        class="power"
        id="og-power"
      >
        —
      </div>
    </div>


    <div class="row-cell gear-wrap">
      <div class="gear">
        ⚙
      </div>
    </div>

  </div>



  <!-- POOL -->

  <div class="consumer-row">

    <div class="row-cell icon-wrap">
      <div class="icon-box">
        <div class="icon blue">≋</div>
      </div>
    </div>


    <div class="row-cell name-wrap">
      <div class="name-col">
        <div class="name">
          Poolpumpe
        </div>
        <div class="sub">
          Pooltechnik
        </div>
      </div>
    </div>


    <div class="row-cell state-wrap">
      <div class="state-col">

        <div
          class="mode"
          id="pool-mode"
        >
          —
        </div>

        <div class="status-line">

          <span
            class="dot"
            id="pool-dot"
          ></span>

          <span id="pool-state">
            —
          </span>

        </div>

      </div>
    </div>


    <div class="row-cell power-wrap">
      <div
        class="power"
        id="pool-power"
      >
        —
      </div>
    </div>


    <div class="row-cell gear-wrap">
      <div class="gear">
        ⚙
      </div>
    </div>

  </div>



  <!-- BOILER -->

  <div class="consumer-row">

    <div class="row-cell icon-wrap">
      <div class="icon-box">
        <div class="icon orange">◉</div>
      </div>
    </div>


    <div class="row-cell name-wrap">
      <div class="name-col">
        <div class="name">
          Boiler
        </div>
        <div class="sub">
          Warmwasser
        </div>
      </div>
    </div>


    <div class="row-cell state-wrap">
      <div class="state-col">

        <div
          class="mode"
          id="boiler-mode"
        >
          —
        </div>

        <div class="status-line">

          <span
            class="dot"
            id="boiler-dot"
          ></span>

          <span id="boiler-state">
            —
          </span>

        </div>

      </div>
    </div>


    <div class="row-cell power-wrap">
      <div
        class="power"
        id="boiler-power"
      >
        —
      </div>
    </div>


    <div class="row-cell gear-wrap">
      <div class="gear">
        ⚙
      </div>
    </div>

  </div>



  <!-- PUFFER -->

  <div class="consumer-row">

    <div class="row-cell icon-wrap">
      <div class="icon-box">
        <div class="icon orange">▥</div>
      </div>
    </div>


    <div class="row-cell name-wrap">
      <div class="name-col">
        <div class="name">
          Heizstab / Puffer
        </div>
        <div class="sub">
          Heizung
        </div>
      </div>
    </div>


    <div class="row-cell state-wrap">
      <div class="state-col">

        <div
          class="mode"
          id="heater-mode"
        >
          —
        </div>

        <div class="status-line">

          <span
            class="dot"
            id="heater-dot"
          ></span>

          <span id="heater-state">
            —
          </span>

        </div>

      </div>
    </div>


    <div class="row-cell power-wrap">
      <div
        class="power"
        id="heater-power"
      >
        —
      </div>
    </div>


    <div class="row-cell gear-wrap">
      <div class="gear">
        ⚙
      </div>
    </div>

  </div>


</div>


<script>

function setText(id,value){

  const el =
    document.getElementById(id);

  if(el){
    el.textContent = value;
  }
}


function modeText(value){

  const mode =
    Number(value);

  if(mode === 1){
    return "Automatik";
  }

  if(mode === 2){
    return "Erzwungen Ein";
  }

  return "Aus";
}


function powerText(value){

  if(
    value === null ||
    value === undefined ||
    Number.isNaN(
      Number(value)
    )
  ){
    return "—";
  }

  const n =
    Number(value);

  if(
    Math.abs(n) < 1
  ){

    return (
      Math.round(
        n * 1000
      ) +
      " W"
    );
  }

  return (
    n.toFixed(1) +
    " kW"
  );
}


function updateConsumer(
  key,
  data
){

  if(!data){
    return;
  }


  const mode =
    Number(
      data.mode
    );


  const active =
    Boolean(
      data.active
    );


  setText(
    key + "-mode",
    modeText(mode)
  );


  setText(
    key + "-state",
    active
      ? "Gerät Ein"
      : "Gerät Aus"
  );


  setText(
    key + "-power",
    powerText(
      data.power
    )
  );


  const modeEl =
    document.getElementById(
      key + "-mode"
    );


  if(modeEl){

    modeEl.classList.toggle(
      "off",
      mode === 0
    );
  }


  const dotEl =
    document.getElementById(
      key + "-dot"
    );


  if(dotEl){

    dotEl.classList.toggle(
      "on",
      active
    );
  }
}


function handleMessage(data){

  if(!data){
    return;
  }


  if(
    typeof data ===
    "string"
  ){

    try{

      data =
        JSON.parse(data);

    }
    catch(e){

      return;
    }
  }


  updateConsumer(
    "ug",
    data.ug
  );


  updateConsumer(
    "og",
    data.og
  );


  updateConsumer(
    "pool",
    data.pool
  );


  updateConsumer(
    "boiler",
    data.boiler
  );


  updateConsumer(
    "heater",
    data.heater
  );
}


window.addEventListener(
  "load",
  function(){

    if(
      typeof requestAction ===
      "function"
    ){

      requestAction(
        "Refresh",
        true
      );
    }
  }
);

</script>


</body>
</html>
