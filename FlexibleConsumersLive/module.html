<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

:root{
  color-scheme: light dark;

  --text:#20262b;
  --muted:#7d878d;
  --line:rgba(0,0,0,.14);
  --row-bg:rgba(0,0,0,.02);

  --blue:#2196f3;
  --orange:#f4a321;
  --green:#19c989;
  --grey:#9ca7af;
}

@media (prefers-color-scheme: dark){
  :root{
    --text:#f1f4f6;
    --muted:#a7afb5;
    --line:rgba(255,255,255,.14);
    --row-bg:rgba(255,255,255,.02);

    --blue:#38a9ff;
    --orange:#ffad2f;
    --green:#22d695;
    --grey:#a4adb6;
  }
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

/* ganze kachel */
.consumer-list{
  width:100%;
  height:100%;
  padding:2.7rem .5rem .5rem;
  display:grid;
  grid-template-rows:repeat(5,minmax(0,1fr));
  gap:.32rem;
  overflow:hidden;
}

/* zeile */
.consumer-row{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-columns:3.1rem minmax(0,1fr) max-content max-content 2.55rem;
  align-items:center;
  column-gap:.55rem;
  padding:.22rem .38rem;
  border:1px solid var(--line);
  border-radius:.82rem;
  background:var(--row-bg);
  overflow:hidden;
}

/* alle zellen schön mittig */
.row-cell{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
}

/* icon */
.icon-wrap{
  justify-content:center;
}

.icon-box{
  width:2.55rem;
  height:2.55rem;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  border-radius:.72rem;
  margin:auto;
}

.icon{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  font-size:1.55rem;
  line-height:1;
}

.blue{color:var(--blue)}
.orange{color:var(--orange)}

/* name */
.name-wrap{
  overflow:hidden;
  justify-content:flex-start;
}

.name-col{
  min-width:0;
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.name{
  font-size:14px;
  font-weight:700;
  line-height:1.12;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sub{
  margin-top:.14rem;
  font-size:13px;
  line-height:1.08;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* mode + status */
.state-wrap{
  justify-content:center;
}

.state-col{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
}

.mode{
  font-size:13px;
  font-weight:650;
  line-height:1.06;
  color:var(--blue);
  white-space:nowrap;
}

.mode.off{
  color:var(--muted);
}

.status-line{
  margin-top:.14rem;
  display:flex;
  align-items:center;
  gap:.34rem;
  font-size:13px;
  line-height:1.06;
  white-space:nowrap;
}

.dot{
  width:.72rem;
  height:.72rem;
  border-radius:50%;
  background:var(--grey);
  flex:0 0 auto;
}

.dot.on{
  background:var(--green);
}

/* power */
.power-wrap{
  justify-content:center;
}

.power{
  min-width:4.35rem;
  text-align:right;
  font-size:14px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}

/* gear */
.gear-wrap{
  justify-content:center;
}

.gear{
  width:2.28rem;
  height:2.28rem;
  border:1px solid var(--line);
  border-radius:.7rem;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.12rem;
  line-height:1;
  background:transparent;
  color:var(--text);
}

/* DESKTOP / LAPTOP */
@media (hover:hover) and (pointer:fine){
  .consumer-row{
    grid-template-columns:3.15rem minmax(0,1fr) max-content max-content 2.55rem;
  }

  .name{font-size:13px}
  .sub{font-size:13px}
  .mode{font-size:13px}
  .status-line{font-size:13px}
  .power{font-size:13px}
}

/* MOBILE */
@media (hover:none) and (pointer:coarse){
  .consumer-list{
    padding:2.7rem .42rem .42rem;
    gap:.28rem;
  }

  .consumer-row{
    grid-template-columns:2.9rem minmax(0,1fr) max-content max-content 2.3rem;
    column-gap:.46rem;
    padding:.20rem .32rem;
  }

  .icon-box{
    width:2.35rem;
    height:2.35rem;
  }

  .icon{
    font-size:1.42rem;
  }

  .name{font-size:14px}
  .sub{font-size:12px}
  .mode{font-size:12px}
  .status-line{font-size:12px}
  .power{
    min-width:3.9rem;
    font-size:14px;
  }

  .gear{
    width:2.08rem;
    height:2.08rem;
    font-size:1.02rem;
  }
}

/* sehr schmal */
@media (hover:none) and (pointer:coarse) and (max-width:430px){
  .consumer-row{
    grid-template-columns:2.75rem minmax(0,1fr) max-content max-content 2.15rem;
    column-gap:.38rem;
    padding:.18rem .28rem;
  }

  .icon-box{
    width:2.18rem;
    height:2.18rem;
  }

  .icon{
    font-size:1.34rem;
  }

  .name{font-size:13px}
  .sub{font-size:12px}
  .mode{font-size:12px}
  .status-line{font-size:12px}
  .power{
    min-width:3.45rem;
    font-size:13px;
  }

  .gear{
    width:1.98rem;
    height:1.98rem;
    font-size:.98rem;
  }
}
</style>
</head>

<body>

<div class="consumer-list">

  <div class="consumer-row">
    <div class="row-cell icon-wrap">
      <div class="icon-box"><div class="icon blue">♧</div></div>
    </div>
    <div class="row-cell name-wrap">
      <div class="name-col">
        <div class="name">Entfeuchter UG</div>
        <div class="sub">Untergeschoss</div>
      </div>
    </div>
    <div class="row-cell state-wrap">
      <div class="state-col">
        <div class="mode" id="ug-mode">—</div>
        <div class="status-line">
          <span class="dot" id="ug-dot"></span>
          <span id="ug-state">—</span>
        </div>
      </div>
    </div>
    <div class="row-cell power-wrap">
      <div class="power" id="ug-power">—</div>
    </div>
    <div class="row-cell gear-wrap">
      <div class="gear">⚙</div>
    </div>
  </div>

  <div class="consumer-row">
    <div class="row-cell icon-wrap">
      <div class="icon-box"><div class="icon blue">♧</div></div>
    </div>
    <div class="row-cell name-wrap">
      <div class="name-col">
        <div class="name">Entfeuchter OG</div>
        <div class="sub">Obergeschoss</div>
      </div>
    </div>
    <div class="row-cell state-wrap">
      <div class="state-col">
        <div class="mode" id="og-mode">—</div>
        <div class="status-line">
          <span class="dot" id="og-dot"></span>
          <span id="og-state">—</span>
        </div>
      </div>
    </div>
    <div class="row-cell power-wrap">
      <div class="power" id="og-power">—</div>
    </div>
    <div class="row-cell gear-wrap">
      <div class="gear">⚙</div>
    </div>
  </div>

  <div class="consumer-row">
    <div class="row-cell icon-wrap">
      <div class="icon-box"><div class="icon blue">≋</div></div>
    </div>
    <div class="row-cell name-wrap">
      <div class="name-col">
        <div class="name">Poolpumpe</div>
        <div class="sub">Pooltechnik</div>
      </div>
    </div>
    <div class="row-cell state-wrap">
      <div class="state-col">
        <div class="mode" id="pool-mode">—</div>
        <div class="status-line">
          <span class="dot" id="pool-dot"></span>
          <span id="pool-state">—</span>
        </div>
      </div>
    </div>
    <div class="row-cell power-wrap">
      <div class="power" id="pool-power">—</div>
    </div>
    <div class="row-cell gear-wrap">
      <div class="gear">⚙</div>
    </div>
  </div>

  <div class="consumer-row">
    <div class="row-cell icon-wrap">
      <div class="icon-box"><div class="icon orange">◉</div></div>
    </div>
    <div class="row-cell name-wrap">
      <div class="name-col">
        <div class="name">Boiler</div>
        <div class="sub">Warmwasser</div>
      </div>
    </div>
    <div class="row-cell state-wrap">
      <div class="state-col">
        <div class="mode" id="boiler-mode">—</div>
        <div class="status-line">
          <span class="dot" id="boiler-dot"></span>
          <span id="boiler-state">—</span>
        </div>
      </div>
    </div>
    <div class="row-cell power-wrap">
      <div class="power" id="boiler-power">—</div>
    </div>
    <div class="row-cell gear-wrap">
      <div class="gear">⚙</div>
    </div>
  </div>

  <div class="consumer-row">
    <div class="row-cell icon-wrap">
      <div class="icon-box"><div class="icon orange">▥</div></div>
    </div>
    <div class="row-cell name-wrap">
      <div class="name-col">
        <div class="name">Heizstab / Puffer</div>
        <div class="sub">Heizung</div>
      </div>
    </div>
    <div class="row-cell state-wrap">
      <div class="state-col">
        <div class="mode" id="heater-mode">—</div>
        <div class="status-line">
          <span class="dot" id="heater-dot"></span>
          <span id="heater-state">—</span>
        </div>
      </div>
    </div>
    <div class="row-cell power-wrap">
      <div class="power" id="heater-power">—</div>
    </div>
    <div class="row-cell gear-wrap">
      <div class="gear">⚙</div>
    </div>
  </div>

</div>

<script>
function setText(id,value){
  const el=document.getElementById(id);
  if(el) el.textContent=value;
}

function modeText(v){
  v=Number(v);
  if(v===1) return "Automatik";
  if(v===2) return "Erzwungen Ein";
  return "Aus";
}

function powerText(v){
  if(v===null || v===undefined || Number.isNaN(Number(v))) return "—";
  const n=Number(v);
  return Math.abs(n)<1 ? Math.round(n*1000)+" W" : n.toFixed(1)+" kW";
}

function updateConsumer(key,data){
  if(!data) return;

  const mode=Number(data.mode);
  const active=Boolean(data.active);

  setText(key+"-mode", modeText(mode));
  setText(key+"-state", active ? "Gerät Ein" : "Gerät Aus");
  setText(key+"-power", powerText(data.power));

  const modeEl=document.getElementById(key+"-mode");
  const dotEl=document.getElementById(key+"-dot");

  if(modeEl) modeEl.classList.toggle("off", mode===0);
  if(dotEl) dotEl.classList.toggle("on", active);
}

function handleMessage(data){
  if(!data) return;

  if(typeof data==="string"){
    try{ data=JSON.parse(data); }
    catch(e){ return; }
  }

  updateConsumer("ug", data.ug);
  updateConsumer("og", data.og);
  updateConsumer("pool", data.pool);
  updateConsumer("boiler", data.boiler);
  updateConsumer("heater", data.heater);
}

window.addEventListener("load", function(){
  if(typeof requestAction==="function"){
    requestAction("Refresh", true);
  }
});
</script>

</body>
</html>
